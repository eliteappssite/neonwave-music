<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Wave - Premium Audio Platform</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-base: #070710;
      --card-bg: rgba(18, 18, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff007f;
      --neon-purple: #9d00ff;
      --text-main: #f0f4f8;
      --text-muted: #8a8ca3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Particles Canvas */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* App Wrapper */
    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      margin-bottom: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand i {
      font-size: 1.8rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 12px var(--neon-cyan);
    }

    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dev-btn {
      background: transparent;
      border: 1px solid var(--neon-purple);
      color: #fff;
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dev-btn:hover {
      background: var(--neon-purple);
      box-shadow: 0 0 15px var(--neon-purple);
    }

    /* Main Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 25px;
      flex: 1;
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Glass Panels */
    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    /* Search Section */
    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
    }

    .search-input-wrap i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 45px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .search-btn {
      padding: 0 24px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      border: none;
      border-radius: 14px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .search-btn:hover {
      opacity: 0.9;
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }

    /* Results Grid */
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: 480px;
      padding-right: 5px;
    }

    .results-list::-webkit-scrollbar {
      width: 6px;
    }
    .results-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .track-card {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .track-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(0, 243, 255, 0.3);
      transform: translateX(4px);
    }

    .track-card img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .track-author {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Right Player Panel */
    .player-panel {
      align-items: center;
      text-align: center;
      justify-content: space-between;
    }

    .cover-art-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 10px auto 20px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 2px solid var(--card-border);
    }

    .cover-art-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .now-playing-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .now-playing-author {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Controls */
    .progress-wrap {
      width: 100%;
      margin-bottom: 20px;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .slider {
      width: 100%;
      accent-color: var(--neon-cyan);
      cursor: pointer;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      color: var(--neon-cyan);
      transform: scale(1.15);
    }

    .play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
      color: #fff;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
    }

    .action-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .dl-btn {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .dl-btn:hover {
      background: var(--neon-magenta);
      border-color: var(--neon-magenta);
      box-shadow: 0 0 15px var(--neon-magenta);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 99;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--neon-purple);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 40px rgba(157, 0, 255, 0.3);
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px; right: 20px;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Hidden YouTube Iframe Container */
    #yt-hidden-player {
      position: absolute;
      top: -9999px;
      left: -9999px;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <!-- Particle Visuals -->
  <canvas id="bg-canvas"></canvas>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="brand">
        <i class="fas fa-wave-square"></i>
        <h1>NEON WAVE</h1>
      </div>
      <button class="dev-btn" id="dev-btn"><i class="fas fa-code"></i> Developer Info</button>
    </header>

    <!-- Main Layout -->
    <div class="main-grid">
      <!-- Left Panel: Search & Results -->
      <div class="panel">
        <div class="search-box">
          <div class="search-input-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" class="search-input" placeholder="Search song name, artist, or YouTube URL...">
          </div>
          <button class="search-btn" id="search-btn">Search</button>
        </div>

        <div class="section-title">
          <i class="fas fa-list-ul" style="color: var(--neon-cyan)"></i> Songs Stream
        </div>

        <div class="results-list" id="results-list">
          <!-- Dynamically populated songs -->
        </div>
      </div>

      <!-- Right Panel: Audio Player Controls -->
      <div class="panel player-panel">
        <div>
          <div class="section-title" style="justify-content: center;">
            <i class="fas fa-compact-disc" style="color: var(--neon-magenta)"></i> Audio Only Player
          </div>

          <div class="cover-art-container">
            <img id="cover-art" src="https://picsum.photos/300" alt="Cover Art">
          </div>

          <div class="now-playing-title" id="player-title">Select a Song</div>
          <div class="now-playing-author" id="player-author">YT Audio Engine</div>
        </div>

        <div class="progress-wrap">
          <input type="range" id="progress-bar" class="slider" value="0" min="0" max="100">
          <div class="time-stamps">
            <span id="curr-time">0:00</span>
            <span id="dur-time">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button class="ctrl-btn" id="prev-btn"><i class="fas fa-step-backward"></i></button>
          <button class="ctrl-btn play-btn" id="play-btn"><i class="fas fa-play"></i></button>
          <button class="ctrl-btn" id="next-btn"><i class="fas fa-step-forward"></i></button>
        </div>

        <div class="action-row">
          <button class="dl-btn" id="dl-btn"><i class="fas fa-download"></i> Download MP3</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Developer Modal -->
  <div class="modal" id="dev-modal">
    <div class="modal-content">
      <span class="close-modal" id="close-modal">&times;</span>
      <h2 style="font-family:'Orbitron'; color:var(--neon-cyan); margin-bottom:10px;">NEON WAVE</h2>
      <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:15px;">v2.5 Premium Audio Streaming Engine</p>
      <p style="font-size:0.85rem; line-height:1.5; margin-bottom:20px;">
        Designed & Built for seamless YouTube Audio extraction, dynamic playback, and custom music streaming experience.
      </p>
      <div style="display:flex; justify-content:center; gap:15px; font-size:1.2rem;">
        <i class="fab fa-github" style="color:var(--neon-cyan);"></i>
        <i class="fab fa-youtube" style="color:var(--neon-magenta);"></i>
        <i class="fas fa-globe" style="color:var(--neon-purple);"></i>
      </div>
    </div>
  </div>

  <!-- Hidden YouTube Player Container -->
  <div id="yt-hidden-player">
    <div id="yt-iframe"></div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // Popular songs preset
    const defaultSongs = [
      { id: 'm67Xdu78PrA', title: 'Top Trending Songs 2026', author: 'Grow Music', thumb: 'https://i.ytimg.com/vi/m67Xdu78PrA/hqdefault.jpg' },
      { id: '10gxMMO2X40', title: 'Best Hindi Love Songs 2026', author: 'VDj Royal', thumb: 'https://i.ytimg.com/vi/10gxMMO2X40/hqdefault.jpg' },
      { id: 'HNdauINck9s', title: 'All Trending Hindi Songs', author: 'COZI Music', thumb: 'https://i.ytimg.com/vi/HNdauINck9s/hqdefault.jpg' }
    ];

    let currentPlaylist = [...defaultSongs];
    let currentIndex = 0;
    let ytPlayer = null;
    let isPlaying = false;
    let progressTimer = null;

    // DOM Elements
    const resultsList = document.getElementById('results-list');
    const playerTitle = document.getElementById('player-title');
    const playerAuthor = document.getElementById('player-author');
    const coverArt = document.getElementById('cover-art');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const progressBar = document.getElementById('progress-bar');
    const currTimeEl = document.getElementById('curr-time');
    const durTimeEl = document.getElementById('dur-time');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const dlBtn = document.getElementById('dl-btn');

    // Init YouTube API
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-iframe', {
        height: '0',
        width: '0',
        videoId: currentPlaylist[0].id,
        playerVars: { 'autoplay': 0, 'controls': 0 },
        events: {
          'onReady': () => { renderPlaylist(); loadTrack(0, false); },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        startProgressLoop();
      } else {
        isPlaying = false;
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        clearInterval(progressTimer);
      }
      if (event.data === YT.PlayerState.ENDED) {
        nextTrack();
      }
    }

    // Load & Play track
    function loadTrack(index, autoPlay = true) {
      currentIndex = index;
      const track = currentPlaylist[index];

      playerTitle.innerText = track.title;
      playerAuthor.innerText = track.author;
      coverArt.src = track.thumb;

      if (ytPlayer && ytPlayer.loadVideoById) {
        if (autoPlay) {
          ytPlayer.loadVideoById(track.id);
        } else {
          ytPlayer.cueVideoById(track.id);
        }
      }
      highlightActiveTrack();
    }

    function renderPlaylist() {
      resultsList.innerHTML = '';
      currentPlaylist.forEach((song, idx) => {
        const card = document.createElement('div');
        card.className = `track-card ${idx === currentIndex ? 'active' : ''}`;
        card.innerHTML = `
          <img src="${song.thumb}" alt="thumb">
          <div class="track-info">
            <div class="track-title">${song.title}</div>
            <div class="track-author">${song.author}</div>
          </div>
          <i class="fas fa-play" style="font-size:0.8rem; color:var(--text-muted)"></i>
        `;
        card.onclick = () => loadTrack(idx, true);
        resultsList.appendChild(card);
      });
    }

    function highlightActiveTrack() {
      const cards = document.querySelectorAll('.track-card');
      cards.forEach((card, idx) => {
        if (idx === currentIndex) {
          card.style.borderColor = 'var(--neon-cyan)';
          card.style.background = 'rgba(255, 255, 255, 0.08)';
        } else {
          card.style.borderColor = 'transparent';
          card.style.background = 'rgba(255, 255, 255, 0.02)';
        }
      });
    }

    // Playback Actions
    playBtn.onclick = () => {
      if (!ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    };

    function nextTrack() {
      currentIndex = (currentIndex + 1) % currentPlaylist.length;
      loadTrack(currentIndex, true);
    }

    function prevTrack() {
      currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
      loadTrack(currentIndex, true);
    }

    nextBtn.onclick = nextTrack;
    prevBtn.onclick = prevTrack;

    // Time Progress Loop
    function startProgressLoop() {
      clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        if (ytPlayer && ytPlayer.getCurrentTime) {
          const curr = ytPlayer.getCurrentTime() || 0;
          const dur = ytPlayer.getDuration() || 0;
          if (dur > 0) {
            progressBar.value = (curr / dur) * 100;
            currTimeEl.innerText = formatTime(curr);
            durTimeEl.innerText = formatTime(dur);
          }
        }
      }, 500);
    }

    progressBar.oninput = (e) => {
      if (ytPlayer && ytPlayer.getDuration) {
        const dur = ytPlayer.getDuration();
        const seekTo = (e.target.value / 100) * dur;
        ytPlayer.seekTo(seekTo, true);
      }
    };

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Download Handler
    dlBtn.onclick = () => {
      const currentTrack = currentPlaylist[currentIndex];
      const dlUrl = `https://y2mate.is/` || `https://cobalt.tools/`;
      window.open(`https://www.youtube.com/watch?v=${currentTrack.id}`, '_blank');
    };

    // Search Handler (Extracts Video ID or performs query fallback)
    function handleSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      let videoId = '';
      if (query.includes('v=')) {
        videoId = query.split('v=')[1].split('&')[0];
      } else if (query.includes('youtu.be/')) {
        videoId = query.split('youtu.be/')[1].split('?')[0];
      }

      if (videoId) {
        const newTrack = {
          id: videoId,
          title: 'Custom YouTube Track',
          author: 'YouTube Stream',
          thumb: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
        };
        currentPlaylist.unshift(newTrack);
        renderPlaylist();
        loadTrack(0, true);
      } else {
        alert("Enter direct YouTube Link or Video ID to stream instantly!");
      }
    }

    searchBtn.onclick = handleSearch
