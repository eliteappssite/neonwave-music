<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Wave - Premium Audio Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #06070d;
      --card-bg: rgba(18, 20, 32, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-purple: #9d00ff;
      --text: #f0f4f8;
      --text-muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; }

    #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

    .app-wrapper { position: relative; z-index: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 20px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand i { font-size: 1.8rem; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }
    .brand h1 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
    
    .dev-btn { background: transparent; border: 1px solid var(--neon-purple); color: #fff; padding: 8px 18px; border-radius: 30px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
    .dev-btn:hover { background: var(--neon-purple); box-shadow: 0 0 15px var(--neon-purple); }

    .main-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; flex: 1; }
    @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }

    .panel { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 24px; padding: 24px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; }

    .search-box { display: flex; gap: 12px; margin-bottom: 24px; }
    .search-input-wrap { position: relative; flex: 1; }
    .search-input-wrap i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .search-input { width: 100%; padding: 14px 16px 14px 45px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border); border-radius: 14px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s; }
    .search-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
    
    .search-btn { padding: 0 24px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); border: none; border-radius: 14px; color: #fff; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .search-btn:hover { opacity: 0.9; box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }

    .results-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; max-height: 480px; padding-right: 4px; }
    .results-list::-webkit-scrollbar { width: 6px; }
    .results-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

    .track-card { display: flex; align-items: center; gap: 14px; padding: 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid transparent; border-radius: 14px; cursor: pointer; transition: 0.25s; }
    .track-card:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(0, 243, 255, 0.3); transform: translateX(4px); }
    .track-card img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
    .track-info { flex: 1; overflow: hidden; }
    .track-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .track-author { font-size: 0.75rem; color: var(--text-muted); }

    .player-panel { text-align: center; justify-content: space-between; align-items: center; }
    .cover-wrap { position: relative; width: 220px; height: 220px; margin: 10px auto 20px; border-radius: 20px; overflow: hidden; border: 2px solid var(--card-border); box-shadow: 0 12px 30px rgba(0,0,0,0.6); }
    .cover-wrap img { width: 100%; height: 100%; object-fit: cover; }
    
    .now-playing-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now-playing-author { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }

    .progress-wrap { width: 100%; margin-bottom: 20px; }
    .slider { width: 100%; accent-color: var(--neon-cyan); cursor: pointer; }
    .time-stamps { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; }

    .controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
    .ctrl-btn { background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
    .ctrl-btn:hover { color: var(--neon-cyan); transform: scale(1.15); }
    .play-btn { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); color: #fff; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }

    .dl-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); border: none; border-radius: 14px; color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .dl-btn:hover { opacity: 0.9; box-shadow: 0 0 20px rgba(255, 0, 127, 0.4); }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 100; align-items: center; justify-content: center; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--neon-purple); border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; text-align: center; position: relative; }
    .close-modal { position: absolute; top: 15px; right: 20px; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }

    #yt-backend-engine { position: absolute; top: -9999px; left: -9999px; visibility: hidden; }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="app-wrapper">
    <header>
      <div class="brand">
        <i class="fas fa-compact-disc"></i>
        <h1>NEON WAVE</h1>
      </div>
      <button class="dev-btn" id="dev-btn"><i class="fas fa-code"></i> Developer Info</button>
    </header>

    <div class="main-layout">
      <!-- Search & Track Section -->
      <div class="panel">
        <div class="search-box">
          <div class="search-input-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" class="search-input" placeholder="Search song name, artist, or YT URL...">
          </div>
          <button class="search-btn" id="search-btn">Search</button>
        </div>

        <div style="font-size:1.05rem; font-weight:700; margin-bottom:15px; display:flex; align-items:center; gap:8px;">
          <i class="fas fa-stream" style="color:var(--neon-cyan)"></i> YouTube Audio Search Results
        </div>

        <div class="results-list" id="results-list"></div>
      </div>

      <!-- Neon Player Section -->
      <div class="panel player-panel">
        <div>
          <div style="font-size:0.9rem; font-weight:700; color:var(--neon-cyan); margin-bottom:10px;">
            <i class="fas fa-headphones"></i> Audio Stream Engine
          </div>

          <div class="cover-wrap">
            <img id="cover-art" src="https://i.ytimg.com/vi/m67Xdu78PrA/hqdefault.jpg" alt="Cover">
          </div>

          <div class="now-playing-title" id="player-title">Select a Song</div>
          <div class="now-playing-author" id="player-author">Backend Audio Stream</div>
        </div>

        <div class="progress-wrap">
          <input type="range" id="progress-bar" class="slider" value="0" min="0" max="100">
          <div class="time-stamps">
            <span id="curr-time">0:00</span>
            <span id="dur-time">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button class="ctrl-btn" id="prev-btn"><i class="fas fa-step-backward"></i></button>
          <button class="ctrl-btn play-btn" id="play-btn"><i class="fas fa-play"></i></button>
          <button class="ctrl-btn" id="next-btn"><i class="fas fa-step-forward"></i></button>
        </div>

        <button class="dl-btn" id="dl-btn"><i class="fas fa-download"></i> Fetch & Download MP3</button>
      </div>
    </div>
  </div>

  <!-- Developer Info Modal -->
  <div class="modal" id="dev-modal">
    <div class="modal-content">
      <span class="close-modal" id="close-modal">&times;</span>
      <h2 style="font-family:'Orbitron'; color:var(--neon-cyan); margin-bottom:10px;">NEON WAVE SITE</h2>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:15px;">v3.0 YouTube Audio Engine</p>
      <p style="font-size:0.85rem; line-height:1.5; margin-bottom:20px;">
        Designed & Built for audio streaming, fast track search, and high quality MP3 downloads.
      </p>
      <div style="display:flex; justify-content:center; gap:15px; font-size:1.3rem;">
        <i class="fab fa-github" style="color:var(--neon-cyan);"></i>
        <i class="fab fa-youtube" style="color:var(--neon-pink);"></i>
      </div>
    </div>
  </div>

  <div id="yt-backend-engine"><div id="yt-player"></div></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const sampleTracks = [
      { id: 'm67Xdu78PrA', title: 'Top Trending Songs 2026', author: 'Grow Music', thumb: 'https://i.ytimg.com/vi/m67Xdu78PrA/hqdefault.jpg' },
      { id: '10gxMMO2X40', title: 'Best Hindi Love Songs', author: 'VDj Royal', thumb: 'https://i.ytimg.com/vi/10gxMMO2X40/hqdefault.jpg' },
      { id: 'HNdauINck9s', title: 'Trending Hindi Playlist', author: 'COZI Music', thumb: 'https://i.ytimg.com/vi/HNdauINck9s/hqdefault.jpg' }
    ];

    let currentPlaylist = [...sampleTracks];
    let currentIndex = 0;
    let ytPlayer = null;
    let isPlaying = false;
    let timer = null;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '0', width: '0',
        videoId: currentPlaylist[0].id,
        playerVars: { 'autoplay': 0, 'controls': 0 },
        events: {
          'onReady': () => { renderResults(); loadTrack(0, false); },
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              document.getElementById('play-btn').innerHTML = '<i class="fas fa-pause"></i>';
              startProgressLoop();
            } else {
              isPlaying = false;
              document.getElementById('play-btn').innerHTML = '<i class="fas fa-play"></i>';
              clearInterval(timer);
            }
            if (e.data === YT.PlayerState.ENDED) nextTrack();
          }
        }
      });
    }

    function renderResults() {
      const list = document.getElementById('results-list');
      list.innerHTML = '';
      currentPlaylist.forEach((track, idx) => {
        const item = document.createElement('div');
        item.className = 'track-card';
        item.style.borderColor = idx === currentIndex ? 'var(--neon-cyan)' : 'transparent';
        item.innerHTML = `
          <img src="${track.thumb}">
          <div class="track-info">
            <div class="track-title">${track.title}</div>
            <div class="track-author">${track.author}</div>
          </div>
          <i class="fas fa-play" style="color:var(--neon-cyan); font-size:0.8rem;"></i>
        `;
        item.onclick = () => loadTrack(idx, true);
        list.appendChild(item);
      });
    }

    function loadTrack(index, autoPlay = true) {
      currentIndex = index;
      const track = currentPlaylist[index];
      document.getElementById('player-title').innerText = track.title;
      document.getElementById('player-author').innerText = track.author;
      document.getElementById('cover-art').src = track.thumb;

      if (ytPlayer && ytPlayer.loadVideoById) {
        if (autoPlay) ytPlayer.loadVideoById(track.id);
        else ytPlayer.cueVideoById(track.id);
      }
      renderResults();
    }

    document.getElementById('play-btn').onclick = () => {
      if (!ytPlayer) return;
      if (isPlaying) ytPlayer.pauseVideo();
      else ytPlayer.playVideo();
    };

    function nextTrack() {
      currentIndex = (currentIndex + 1) % currentPlaylist.length;
      loadTrack(currentIndex, true);
    }
    function prevTrack() {
      currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
      loadTrack(currentIndex, true);
    }

    document.getElementById('next-btn').onclick = nextTrack;
    document.getElementById('prev-btn').onclick = prevTrack;

    function startProgressLoop() {
      clearInterval(timer);
      timer = setInterval(() => {
        if (ytPlayer && ytPlayer.getCurrentTime) {
          const curr = ytPlayer.getCurrentTime() || 0;
          const dur = ytPlayer.getDuration() || 0;
          if (dur > 0) {
            document.getElementById('progress-bar').value = (curr / dur) * 100;
            document.getElementById('curr-time').innerText = fmtTime(curr);
            document.getElementById('dur-time').innerText = fmtTime(dur);
          }
        }
      }, 500);
    }

    document.getElementById('progress-bar').oninput = (e) => {
      if (ytPlayer && ytPlayer.getDuration) {
        const dur = ytPlayer.getDuration();
        ytPlayer.seekTo((e.target.value / 100) * dur, true);
      }
    };

    function fmtTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Direct YouTube Search & Link Extractor
    document.getElementById('search-btn').onclick = () => {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;

      let vid = '';
      if (q.includes('v=')) vid = q.split('v=')[1].split('&')[0];
      else if (q.includes('youtu.be/')) vid = q.split('youtu.be/')[1].split('?')[0];
      else if (q.length === 11) vid = q;

      if (vid) {
        const newTrack = { id: vid, title: 'YouTube Audio Stream', author: 'YouTube Track', thumb: `https://i.ytimg.com/vi/${vid}/hqdefault.jpg` };
        currentPlaylist.unshift(newTrack);
        loadTrack(0, true);
      } else {
        alert('Paste YouTube URL or Video ID to play instantly!');
      }
    };

    document.getElementById('dl-btn').onclick = () => {
      const track = currentPlaylist[currentIndex];
      window.open(`https://www.youtube.com/watch?v=${track.id}`, '_blank');
    };

    // Modal Events
    const modal = document.getElementById('dev-modal');
    document.getElementById('dev-btn').onclick = () => modal.style.display = 'flex';
    document.getElementById('close-modal').onclick = () => modal.style.display = 'none';

    // Background Canvas Visuals
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize;
    resize();
    for(let i=0; i<40; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*2+1, dx: (Math.random()-0.5)*0.5, dy: (Math.random()-0.5)*0.5 });
    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = 'rgba(0, 243, 255, 0.3)';
      pts.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        p.x += p.dx; p.y += p.dy;
        if(p.x<0 || p.x>canvas.width) p.dx *= -1;
        if(p.y<0 || p.y>canvas.height) p.dy *= -1;
      });
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
