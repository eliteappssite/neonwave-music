<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Wave Premium - Ultimate Audio Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#06070d;--card:#121420;--cyan:#00f3ff;--pink:#ff007f;--purple:#9d00ff;--muted:#8b949e}
*{box-sizing:border-box;margin:0;padding:0}
html, body { height: 100vh; overflow: hidden; background: var(--bg); color: #f0f4f8; font-family: 'Plus Jakarta Sans', sans-serif; }

#bg-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}

.app{position:relative;z-index:1;max-width:1150px;height:100vh;margin:auto;padding:12px;display:flex;flex-direction:column;overflow:hidden}

header{background:rgba(18,20,32,.95);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:12px 18px;margin-bottom:12px;backdrop-filter:blur(16px);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
h1{font:900 1.2rem Orbitron,sans-serif;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

button{cursor:pointer;border:0;border-radius:10px;padding:8px 14px;color:white;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--purple));transition:0.3s}
button:hover{opacity:0.9}
input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:#090a12;color:white;font:inherit;outline:none}
input:focus{border-color:var(--cyan)}

.search-box{display:flex;gap:8px;margin-bottom:8px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab-btn{flex:1;background:rgba(255,255,255,0.04);color:var(--muted);font-size:0.78rem;padding:6px;border-radius:8px}
.tab-btn.active{background:var(--cyan);color:#000;font-weight:800}

.layout{display:grid;grid-template-columns:1fr 350px;gap:14px;flex:1;min-height:0;align-items:stretch}
.panel{background:rgba(18,20,32,.95);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* Results Column inside panel */
.results-container{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px;min-height:0}
.results-container::-webkit-scrollbar{width:4px}
.results-container::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:4px}

.track{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid rgba(255,255,255,0.05);border-radius:10px;cursor:pointer;background:rgba(255,255,255,0.02);flex-shrink:0}
.track:hover{border-color:var(--cyan);background:rgba(255,255,255,0.06)}
.track img{width:65px;height:45px;object-fit:cover;border-radius:6px;flex-shrink:0}
.info{flex:1;min-width:0}
.title{font-weight:700;font-size:0.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.author{font-size:0.68rem;color:var(--muted)}
.save-track-btn{background:none;color:var(--muted);padding:4px;font-size:0.95rem}
.save-track-btn.saved{color:var(--pink)}

/* Player Panel */
.player{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow-y:auto}
#player-title{font-weight:700;font-size:0.88rem;margin:4px 0 2px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player-author{color:var(--muted);font-size:0.72rem;margin-bottom:6px}

/* Clean Video Mode & Cover Container */
.media-container{width:140px;height:140px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,0.1);margin:4px auto 8px;box-shadow:0 6px 15px rgba(0,0,0,0.6);transition:all 0.3s ease;position:relative;background:#000;flex-shrink:0}
.media-container.video-mode{width:100%;aspect-ratio:16/9;height:auto;border-radius:10px}
.media-container img{width:100%;height:100%;object-fit:cover}

/* Synced Lyrics Box */
.lyrics-box{width:100%;height:75px;overflow-y:auto;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:6px;font-size:0.72rem;color:var(--muted);margin-bottom:8px;text-align:center;line-height:1.4;scroll-behavior:smooth;flex-shrink:0}
.lyrics-box::-webkit-scrollbar{width:3px}
.lyrics-box::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:3px}
.lyric-line{transition:0.3s;margin:2px 0}
.lyric-line.active{color:var(--cyan);font-weight:700;transform:scale(1.02)}

.progress-wrap{width:100%;margin-bottom:6px;flex-shrink:0}
#progress{width:100%;accent-color:var(--cyan);cursor:pointer}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:0.68rem;margin-top:2px}

.controls{display:flex;justify-content:center;align-items:center;gap:10px;margin:4px 0;flex-shrink:0}
.ctrl-btn{background:none;border:none;color:#fff;font-size:1rem;cursor:pointer}
#play{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));font-size:0.9rem;display:flex;align-items:center;justify-content:center}

.secondary{background:#29243c}
.secondary:hover{background:#3b3254}

.dl-btn{width:100%;margin-top:4px;background:linear-gradient(135deg,var(--pink),var(--purple));display:flex;align-items:center;justify-content:center;gap:6px;font-size:0.78rem;padding:8px;flex-shrink:0}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-content{background:var(--card);border:1px solid var(--purple);border-radius:18px;padding:20px;max-width:320px;text-align:center;position:relative}

#yt-background-container{position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0.01;z-index:9999;pointer-events:none}

@media(max-width:850px){.layout{grid-template-columns:1fr}.app{padding:8px;height:100vh;overflow-y:auto}}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="app">
<header>
  <h1><i class="fas fa-compact-disc"></i> NEON WAVE</h1>
  <button class="secondary" id="dev-btn" style="padding:6px 10px;font-size:0.75rem"><i class="fas fa-code"></i> Developer</button>
</header>

<div class="layout">
<section class="panel">
  <form class="search-box" id="search-form">
    <input id="search-input" placeholder="Search song or paste YouTube link..." autocomplete="off">
    <button type="submit"><i class="fas fa-search"></i></button>
  </form>

  <div class="tabs">
    <button class="tab-btn active" id="tab-search">Search / Trending</button>
    <button class="tab-btn" id="tab-playlist">My Playlist (<span id="playlist-count">0</span>)</button>
  </div>

  <div class="status" id="status" style="color:var(--cyan);font-size:0.75rem;margin-bottom:8px">Ready to play.</div>
  <div class="results-container" id="results"></div>
</section>

<section class="panel player">
  <div style="display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:2px">
    <div style="color:var(--cyan);font-weight:700;font-size:0.75rem"><i class="fas fa-headphones"></i> NOW PLAYING</div>
    <button class="secondary" id="toggle-view-btn" style="padding:4px 8px;font-size:0.68rem;border-radius:6px"><i class="fas fa-video"></i> Show Video</button>
  </div>

  <!-- Unified Media Box (Holds Cover Image or Clean YouTube Player without controls) -->
  <div class="media-container" id="media-container">
    <img id="cover-art" src="https://i.ytimg.com/vi/HNdauINck9s/hqdefault.jpg" alt="Cover">
    <div id="yt-player" style="width:100%;height:100%;display:none;pointer-events:none;"></div>
  </div>

  <div id="player-title">Select a song</div>
  <div id="player-author">YouTube</div>

  <!-- Animated Synced Lyrics Box -->
  <div class="lyrics-box" id="lyrics-display">
    <div class="lyric-line active">🎵 Lyrics will synchronize automatically...</div>
  </div>

  <div class="progress-wrap">
    <input id="progress" type="range" min="0" max="100" value="0">
    <div class="times"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
  </div>

  <div class="controls">
    <button class="secondary ctrl-btn" id="prev" aria-label="Previous"><i class="fas fa-backward"></i></button>
    <button class="ctrl-btn" id="play" aria-label="Play"><i class="fas fa-play"></i></button>
    <button class="secondary ctrl-btn" id="next" aria-label="Next"><i class="fas fa-forward"></i></button>
  </div>

  <button class="dl-btn" id="dl-btn"><i class="fas fa-download"></i> Download MP3</button>
</section>
</div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <button id="close-modal" class="secondary" style="position:absolute;top:10px;right:14px;padding:3px 6px;font-size:0.7rem">✕</button>
    
    <div style="width:60px;height:60px;border-radius:50%;margin:0 auto 8px;overflow:hidden;border:2px solid var(--cyan);box-shadow:0 0 12px rgba(0,243,255,0.4);background:#090a12;display:flex;align-items:center;justify-content:center;">
      <i class="fas fa-user-astronaut" style="font-size:1.8rem;color:var(--cyan)"></i>
    </div>

    <h2 style="font-family:Orbitron;color:var(--cyan);font-size:1rem;margin-bottom:2px">NEON WAVE</h2>
    <p style="color:var(--pink);font-weight:700;font-size:0.8rem;margin-bottom:4px">Developed by Tarun</p>
    <p style="color:var(--muted);font-size:0.72rem;line-height:1.3;margin-bottom:12px">Neon Wave Premium — Clean unified player, synchronized lyrics, fixed layout, and background playback.</p>
    
    <a href="https://www.instagram.com/tarun.amv?mdxt=bXZndmRvN3Q1d2No" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;border-radius:18px;text-decoration:none;font-weight:700;font-size:0.75rem;">
      <i class="fab fa-instagram"></i> Follow @tarun.amv
    </a>
  </div>
</div>

<script>
const YOUTUBE_API_KEY = "AIzaSyDVnj4IsgnFxJwnBysA5wk8kF4DVJBsEWs";

const $ = id => document.getElementById(id);
const status = $("status");
let player = null;
let ready = false;
let currentList = [];
let savedPlaylist = JSON.parse(localStorage.getItem("neon_playlist") || "[]");
let activeTab = "search";
let index = -1;
let progressTimer = null;
let isVideoMode = false;
let currentLyricsArr = [];

const defaultTrending = [
  { id: 'HNdauINck9s', title: 'Trending Hindi Mashup 2026', author: 'COZI Music', thumb: 'https://i.ytimg.com/vi/HNdauINck9s/hqdefault.jpg' },
  { id: '10gxMMO2X40', title: 'Best Bollywood Love Songs', author: 'VDj Royal', thumb: 'https://i.ytimg.com/vi/10gxMMO2X40/hqdefault.jpg' },
  { id: 'm67Xdu78PrA', title: 'Top Global Chartbusters', author: 'Grow Music', thumb: 'https://i.ytimg.com/vi/m67Xdu78PrA/hqdefault.jpg' },
  { id: '5qap5aO4i9A', title: 'Lofi Hip Hop Radio - Beats', author: 'Lofi Girl', thumb: 'https://i.ytimg.com/vi/5qap5aO4i9A/hqdefault.jpg' }
];

currentList = [...defaultTrending];

function setStatus(msg){ status.textContent = msg; }
function updatePlaylistCount(){ $("playlist-count").textContent = savedPlaylist.length; }
updatePlaylistCount();

function formatTime(val){
  if(!Number.isFinite(val) || val < 0) return "0:00";
  const s = Math.floor(val);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

function getVideoId(text){
  try{
    const url = new URL(text);
    if(url.hostname === "youtu.be") return url.pathname.split("/")[1] || null;
    if(url.hostname.endsWith("youtube.com")){
      if(url.pathname === "/watch") return url.searchParams.get("v");
      const parts = url.pathname.split("/");
      if(["embed","shorts","live"].includes(parts[1])) return parts[2] || null;
    }
  }catch{}
  return /^[a-zA-Z0-9_-]{11}$/.test(text) ? text : null;
}

function onYouTubeIframeAPIReady(){
  // Clean YouTube Player parameters without any user-facing controls or overlays
  player = new YT.Player("yt-player",{
    width:"100%",
    height:"100%",
    videoId: currentList[0].id,
    playerVars:{ playsinline:1, controls:0, disablekb:1, fs:0, modestbranding:1, rel:0, autoplay:0, iv_load_policy:3 },
    events:{
      onReady:()=>{
        ready = true;
        setStatus("Ready. Search or pick a track.");
        renderResults();
      },
      onStateChange:event=>{
        if(event.data === YT.PlayerState.PLAYING){
          $("play").innerHTML='<i class="fas fa-pause"></i>';
          setStatus("Playing audio.");
          startProgress();
          updateMediaSession();
        }else{
          $("play").innerHTML='<i class="fas fa-play"></i>';
          if(event.data === YT.PlayerState.ENDED) nextTrack();
          if(event.data !== YT.PlayerState.PLAYING) stopProgress();
        }
      },
      onError:()=>{ nextTrack(); }
    }
  });
}

function startProgress(){
  stopProgress();
  progressTimer = setInterval(()=>{
    if(!player || !ready) return;
    const duration = player.getDuration() || 0;
    const current = player.getCurrentTime() || 0;
    $("progress").value = duration ? current/duration*100 : 0;
    $("current-time").textContent = formatTime(current);
    $("duration").textContent = formatTime(duration);
    syncAnimatedLyrics(current);
  },400);
}

function stopProgress(){
  if(progressTimer) clearInterval(progressTimer);
  progressTimer = null;
}

function playTrack(i){
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(!targetList.length || !ready) return;
  index = (i + targetList.length) % targetList.length;
  const track = targetList[index];
  $("player-title").textContent = track.title;
  $("player-author").textContent = track.author;
  $("cover-art").src = track.thumb;

  player.loadVideoById(track.id);
  renderResults();
  updateMediaSession();
  fetchLyrics(track.title);
}

function nextTrack(){
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(targetList.length) playTrack(index+1);
}
function prevTrack(){
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(targetList.length) playTrack(index-1);
}

function updateMediaSession(){
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if('mediaSession' in navigator && index >= 0 && targetList[index]){
    const track = targetList[index];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: track.author,
      artwork: [{ src: track.thumb, sizes: '512x512', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('play', () => player.playVideo());
    navigator.mediaSession.setActionHandler('pause', () => player.pauseVideo());
    navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
    navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
  }
}

async function fetchLyrics(songTitle){
  const box = $("lyrics-display");
  box.innerHTML = '<div class="lyric-line active">Fetching synchronized lyrics...</div>';
  currentLyricsArr = [];
  try{
    const clean = songTitle.replace(/official|video|lyrics|audio|hd|4k/gi, "").trim();
    const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(clean)}`);
    const data = await res.json();
    if(data && data.length > 0){
      const matched = data.find(item => item.syncedLyrics) || data[0];
      if(matched.syncedLyrics){
        currentLyricsArr = parseSyncedLyrics(matched.syncedLyrics);
        renderLyricLines(currentLyricsArr);
      } else if(matched.plainLyrics){
        const lines = matched.plainLyrics.split("\n");
        box.innerHTML = lines.map(l => `<div class="lyric-line">${l}</div>`).join("");
      } else {
        box.innerHTML = '<div class="lyric-line active">No lyrics available.</div>';
      }
    } else {
      box.innerHTML = '<div class="lyric-line active">No lyrics found.</div>';
    }
  }catch(e){
    box.innerHTML = '<div class="lyric-line active">Could not load lyrics.</div>';
  }
}

function parseSyncedLyrics(lrc){
  const lines = lrc.split("\n");
  const result = [];
  const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
  for(let line of lines){
    const match = regex.exec(line);
    if(match){
      const min = parseInt(match[1], 10);
      const sec = parseInt(match[2], 10);
      const ms = parseInt(match[3].padEnd(3, "0"), 10);
      const time = min * 60 + sec + ms / 1000;
      const text = match[4].trim();
      if(text) result.push({ time, text });
    }
  }
  return result;
}

function renderLyricLines(arr){
  const box = $("lyrics-display");
  box.innerHTML = arr.map((item, idx) => `<div class="lyric-line" data-time="${item.time}" id="line-${idx}">${item.text}</div>`).join("");
}

function syncAnimatedLyrics(currentTime){
  if(!currentLyricsArr.length) return;
  let activeIdx = 0;
  for(let i = 0; i < currentLyricsArr.length; i++){
    if(currentTime >= currentLyricsArr[i].time){
      activeIdx = i;
    } else {
      break;
    }
  }
  const lines = document.querySelectorAll(".lyric-line");
  lines.forEach((l, idx) => {
    if(idx === activeIdx){
      if(!l.classList.contains("active")){
        l.classList.add("active");
        l.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } else {
      l.classList.remove("active");
    }
  });
}

function renderResults(){
  const list = $("results");
  list.replaceChildren();
  const displayList = activeTab === "search" ? currentList : savedPlaylist;

  if(displayList.length === 0){
    const empty = document.createElement("div");
    empty.style.cssText = "text-align:center;color:var(--muted);padding:30px 0;font-size:0.8rem;";
    empty.textContent = activeTab === "search" ? "No results found." : "Your playlist is empty! Save tracks using the heart icon.";
    list.append(empty);
    return;
  }

  displayList.forEach((track,i)=>{
    const card = document.createElement("div");
    card.className = "track";

    const img = document.createElement("img");
    img.src = track.thumb;
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = track.title;

    const author = document.createElement("div");
    author.className = "author";
    author.textContent = track.author;

    info.append(title,author);

    const saveBtn = document.createElement("button");
    const isSaved = savedPlaylist.some(s => s.id === track.id);
    saveBtn.className = `save-track-btn ${isSaved ? 'saved' : ''}`;
    saveBtn.innerHTML = `<i class="${isSaved ? 'fas' : 'far'} fa-heart"></i>`;
    saveBtn.title = "Save to Playlist";
    
    saveBtn.addEventListener("click",(e)=>{
      e.stopPropagation();
      toggleSaveTrack(track);
    });

    card.append(img,info,saveBtn);

    if(i === index && ((activeTab==="search" && currentList===displayList) || (activeTab==="playlist" && savedPlaylist===displayList))){
      card.style.borderColor = "var(--cyan)";
    }
    card.addEventListener("click",()=>playTrack(i));
    list.append(card);
  });
}

function toggleSaveTrack(track){
  const idx = savedPlaylist.findIndex(s => s.id === track.id);
  if(idx !== -1){
    savedPlaylist.splice(idx,1);
    setStatus("Removed from playlist.");
  } else {
    savedPlaylist.push(track);
    setStatus("Saved to playlist!");
  }
  localStorage.setItem("neon_playlist", JSON.stringify(savedPlaylist));
  updatePlaylistCount();
  renderResults();
}

$("tab-search").addEventListener("click",()=>{
  activeTab = "search";
  $("tab-search").classList.add("active");
  $("tab-playlist").classList.remove("active");
  index = -1;
  renderResults();
});

$("tab-playlist").addEventListener("click",()=>{
  activeTab = "playlist";
  $("tab-playlist").classList.add("active");
  $("tab-search").classList.remove("active");
  index = -1;
  renderResults();
});

// Toggle Video Mode using the exact same player instance without echo
$("toggle-view-btn").addEventListener("click",()=>{
  isVideoMode = !isVideoMode;
  const container = $("media-container");
  const img = $("cover-art");
  const ytDiv = $("yt-player");
  const lyricsBox = $("lyrics-display");

  if(isVideoMode){
    container.classList.add("video-mode");
    img.style.display = "none";
    ytDiv.style.display = "block";
    lyricsBox.style.display = "none";
    $("toggle-view-btn").innerHTML = '<i class="fas fa-headphones"></i> Show Lyrics';
  } else {
    container.classList.remove("video-mode");
    ytDiv.style.display = "none";
    img.style.display = "block";
    lyricsBox.style.display = "block";
    $("toggle-view-btn").innerHTML = '<i class="fas fa-video"></i> Show Video';
  }
});

async function searchYouTube(query){
  if(!YOUTUBE_API_KEY) throw new Error("API Key missing");
  const params = new URLSearchParams({
    part:"snippet", type:"video", videoEmbeddable:"true", maxResults:"15", q:query, regionCode:"IN", key:YOUTUBE_API_KEY
  });
  const res = await fetch("https://www.googleapis.com/youtube/v3/search?"+params);
  const data = await res.json();
  if(!res.ok) throw new Error(data.error?.message || "YouTube search failed");
  return (data.items || []).filter(item=>item.id?.videoId).map(item=>({
    id:item.id.videoId,
    title:item.snippet.title,
    author:item.snippet.channelTitle,
    thumb:item.snippet.thumbnails?.medium?.url || "https://i.ytimg.com/vi/"+item.id.videoId+"/hqdefault.jpg"
  }));
}

$("search-form").addEventListener("submit",async event=>{
  event.preventDefault();
  const query = $("search-input").value.trim();
  if(!query) return;

  const videoId = getVideoId(query);
  if(videoId){
    const directTrack = { id:videoId, title:"Custom YouTube Track", author:"YouTube Stream", thumb:"https://i.ytimg.com/vi/"+videoId+"/hqdefault.jpg" };
    currentList = [directTrack, ...currentList.filter(t=>t.id!==videoId)];
    activeTab = "search";
    $("tab-search").classList.add("active");
    $("tab-playlist").classList.remove("active");
    renderResults();
    if(ready) playTrack(0);
    return;
  }

  setStatus("Searching YouTube...");
  try{
    const results = await searchYouTube(query);
    if(!results.length){
      setStatus("No results found. Showing trending suggestions.");
      currentList = defaultTrending;
      renderResults();
      return;
    }
    currentList = results;
    activeTab = "search";
    $("tab-search").classList.add("active");
    $("tab-playlist").classList.remove("active");
    index = -1;
    renderResults();
    setStatus("Found "+currentList.length+" tracks.");
    playTrack(0);
  }catch(err){
    setStatus("Error: "+err.message);
  }
});

$("play").addEventListener("click",()=>{
  if(!ready){setStatus("Loading player...");return;}
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(index < 0){ if(targetList.length) playTrack(0); return; }
  const state = player.getPlayerState();
  if(state === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
});

$("next").addEventListener("click",nextTrack);
$("prev").addEventListener("click",prevTrack);

$("progress").addEventListener("change",()=>{
  if(!ready || index < 0) return;
  const duration = player.getDuration();
  if(duration) player.seekTo(duration * Number($("progress").value)/100,true);
});

// Auto-Paste YouTube Link into Download Mirror format: https://good-enough-gallery.pl/#u=https://youtu.be/...
$("dl-btn").addEventListener("click",()=>{
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(index < 0 || !targetList[index]){ alert("Please play or select a song first!"); return; }
  const track = targetList[index];
  const ytUrl = `https://youtu.be/${track.id}`;
  const finalDlUrl = `https://good-enough-gallery.pl/#u=${encodeURI(ytUrl)}`;
  window.open(finalDlUrl, "_blank");
});

$("dev-btn").addEventListener("click",()=>{$("modal").style.display="flex";});
$("close-modal").addEventListener("click",()=>{$("modal").style.display="none";});
$("modal").addEventListener("click",e=>{ if(e.target === $("modal")) $("modal").style.display="none"; });

// Background Particles
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let pts = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.onresize = resize;
resize();
for(let i=0; i<40; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*2+1, dx: (Math.random()-0.5)*0.4, dy: (Math.random()-0.5)*0.4 });
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = 'rgba(0, 243, 255, 0.25)';
  pts.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    p.x += p.dx; p.y += p.dy;
    if(p.x<0 || p.x>canvas.width) p.dx *= -1;
    if(p.y<0 || p.y>canvas.height) p.dy *= -1;
  });
  requestAnimationFrame(draw);
}
draw();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
