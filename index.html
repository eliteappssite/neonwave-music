<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Wave - Premium Audio Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#06070d;--card:rgba(18, 20, 32, 0.9);--cyan:#00f3ff;--pink:#ff007f;--purple:#9d00ff;--muted:#8b949e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#f0f4f8;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;overflow-x:hidden}

#bg-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}

.app{position:relative;z-index:1;max-width:1100px;margin:auto;padding:16px;display:flex;flex-direction:column;min-height:100vh}

header,.panel{background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
header{display:flex;justify-content:space-between;align-items:center}
h1{font:900 1.25rem Orbitron,sans-serif;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

button{cursor:pointer;border:0;border-radius:12px;padding:10px 16px;color:white;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--purple));transition:0.3s}
button:hover{opacity:0.9}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.4);color:white;font:inherit;outline:none}
input:focus{border-color:var(--cyan)}

.search-box{display:flex;gap:10px;margin-bottom:12px}
.tabs{display:flex;gap:10px;margin-bottom:12px}
.tab-btn{flex:1;background:rgba(255,255,255,0.05);color:var(--muted);font-size:0.85rem;padding:8px}
.tab-btn.active{background:var(--cyan);color:#000;font-weight:800}

.layout{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}

/* Fixed Height Column for Results to prevent UI jumping */
.results-container{height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.results-container::-webkit-scrollbar{width:4px}
.results-container::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:4px}

.track{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid transparent;border-radius:12px;cursor:pointer;background:rgba(255,255,255,0.02);flex-shrink:0}
.track:hover{border-color:rgba(0,243,255,0.3);background:rgba(255,255,255,0.05)}
.track img{width:50px;height:50px;object-fit:cover;border-radius:8px;flex-shrink:0}
.info{flex:1;min-width:0}
.title{font-weight:600;font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.author{font-size:0.7rem;color:var(--muted)}
.save-track-btn{background:none;color:var(--muted);padding:6px;font-size:1rem}
.save-track-btn.saved{color:var(--pink)}

.player{text-align:center;display:flex;flex-direction:column;align-items:center}
.cover-wrap{width:160px;height:160px;margin:8px auto 14px;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,0.08);box-shadow:0 8px 25px rgba(0,0,0,0.6);flex-shrink:0}
.cover-wrap img{width:100%;height:100%;object-fit:cover}

#player-title{font-weight:700;font-size:0.95rem;margin-bottom:2px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player-author{color:var(--muted);font-size:0.75rem;margin-bottom:12px}

.controls{display:flex;justify-content:center;align-items:center;gap:15px;margin:10px 0}
.ctrl-btn{background:none;border:none;color:#fff;font-size:1.1rem;cursor:pointer}
.ctrl-btn:hover{color:var(--cyan)}
#play{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px rgba(0,243,255,0.4)}

.progress-wrap{width:100%;margin-bottom:10px}
#progress{width:100%;accent-color:var(--cyan);cursor:pointer}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:0.7rem;margin-top:4px}

.secondary{background:transparent;border:1px solid var(--purple)}
.secondary:hover{background:var(--purple)}

.dl-btn{width:100%;background:linear-gradient(135deg,var(--pink),var(--purple));margin-top:8px;font-size:0.85rem;padding:10px}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-content{background:var(--card);border:1px solid var(--purple);border-radius:20px;padding:24px;max-width:360px;text-align:center;position:relative}

/* 1x1 Pixel Background Player Trick */
#yt-background-container{position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0.01;z-index:9999;pointer-events:none}

@media(max-width:850px){.layout{grid-template-columns:1fr}.app{padding:10px}}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="app">
<header>
  <h1><i class="fas fa-compact-disc"></i> NEON WAVE</h1>
  <button class="secondary" id="dev-btn" style="padding:8px 12px;font-size:0.8rem;"><i class="fas fa-code"></i> Developer</button>
</header>

<div class="layout">
<section class="panel">
  <form class="search-box" id="search-form">
    <input id="search-input" placeholder="Search song name or YT link..." autocomplete="off">
    <button type="submit"><i class="fas fa-search"></i></button>
  </form>

  <div class="tabs">
    <button class="tab-btn active" id="tab-search">Search / Trending</button>
    <button class="tab-btn" id="tab-playlist">My Playlist (<span id="playlist-count">0</span>)</button>
  </div>

  <div style="color:var(--cyan);font-size:0.75rem;margin-bottom:8px;" id="status">Ready to play.</div>
  
  <!-- Fixed column scroll container -->
  <div class="results-container" id="results"></div>
</section>

<section class="panel player">
  <div>
    <div style="color:var(--cyan);font-weight:700;font-size:0.8rem;margin-bottom:6px">
      <i class="fas fa-headphones"></i> NOW PLAYING
    </div>
    <div class="cover-wrap">
      <img id="cover-art" src="https://i.ytimg.com/vi/HNdauINck9s/hqdefault.jpg" alt="Cover">
    </div>
    <div id="player-title">Select a song</div>
    <div id="player-author">Neon Wave Music</div>
  </div>

  <div class="progress-wrap">
    <input id="progress" type="range" min="0" max="100" value="0">
    <div class="times"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prev" aria-label="Previous"><i class="fas fa-step-backward"></i></button>
    <button class="ctrl-btn" id="play" aria-label="Play"><i class="fas fa-play"></i></button>
    <button class="ctrl-btn" id="next" aria-label="Next"><i class="fas fa-step-forward"></i></button>
  </div>

  <button class="dl-btn" id="dl-btn"><i class="fas fa-download"></i> Download MP3</button>
</section>
</div>
</div>

<div id="yt-background-container"><div id="yt-player"></div></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <button id="close-modal" class="secondary" style="position:absolute; top:12px; right:16px; padding:4px 8px;font-size:0.8rem;">✕</button>
    <h2 style="font-family:Orbitron;color:var(--cyan);font-size:1.1rem;margin-bottom:4px">NEON WAVE</h2>
    <p style="color:var(--pink);font-weight:700;font-size:0.85rem;margin-bottom:8px">Developed by Tarun</p>
    <p style="color:var(--muted);font-size:0.78rem;line-height:1.4;margin-bottom:16px">Neon Wave Premium — Fixed layout scrolling columns, background play, and custom local playlist saver.</p>
    <a href="https://www.instagram.com/tarun.amv?mdxt=bXZndmRvN3Q1d2No" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);color:#fff;border-radius:20px;text-decoration:none;font-weight:700;font-size:0.8rem;">
      <i class="fab fa-instagram"></i> Follow @tarun.amv
    </a>
  </div>
</div>

<script>
const YOUTUBE_API_KEY = "YOUR_API_KEY";

const $ = id => document.getElementById(id);
const status = $("status");
let player = null;
let ready = false;
let currentList = [];
let savedPlaylist = JSON.parse(localStorage.getItem("neon_playlist") || "[]");
let activeTab = "search"; // 'search' or 'playlist'
let index = -1;
let progressTimer = null;

const defaultTracks = [
  { id: 'HNdauINck9s', title: 'Trending Hindi Songs 2026', author: 'COZI Music', thumb: 'https://i.ytimg.com/vi/HNdauINck9s/hqdefault.jpg' },
  { id: '10gxMMO2X40', title: 'Best Hindi Love Songs', author: 'VDj Royal', thumb: 'https://i.ytimg.com/vi/10gxMMO2X40/hqdefault.jpg' },
  { id: 'm67Xdu78PrA', title: 'Top Global Hits', author: 'Grow Music', thumb: 'https://i.ytimg.com/vi/m67Xdu78PrA/hqdefault.jpg' }
];

currentList = [...defaultPlaylist];

function setStatus(msg){ status.textContent = msg; }
function updatePlaylistCount(){ $("playlist-count").textContent = savedPlaylist.length; }
updatePlaylistCount();

function formatTime(val){
  if(!Number.isFinite(val) || val < 0) return "0:00";
  const s = Math.floor(val);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

function getVideoId(text){
  try{
    const url = new URL(text);
    if(url.hostname === "youtu.be") return url.pathname.split("/")[1] || null;
    if(url.hostname.endsWith("youtube.com")){
      if(url.pathname === "/watch") return url.searchParams.get("v");
      const parts = url.pathname.split("/");
      if(["embed","shorts","live"].includes(parts[1])) return parts[2] || null;
    }
  }catch{}
  return /^[a-zA-Z0-9_-]{11}$/.test(text) ? text : null;
}

function onYouTubeIframeAPIReady(){
  player = new YT.Player("yt-player",{
    width:"100%",
    height:"100%",
    videoId: currentList[0].id,
    playerVars:{ playsinline:1, controls:0, rel:0, autoplay:0 },
    events:{
      onReady:()=>{
        ready = true;
        setStatus("Ready. Search or pick a track.");
        renderResults();
      },
      onStateChange:event=>{
        if(event.data === YT.PlayerState.PLAYING){
          $("play").innerHTML='<i class="fas fa-pause"></i>';
          setStatus("Playing audio.");
          startProgress();
          updateMediaSession();
        }else{
          $("play").innerHTML='<i class="fas fa-play"></i>';
          if(event.data === YT.PlayerState.ENDED) nextTrack(); // Auto Next Play
          if(event.data !== YT.PlayerState.PLAYING) stopProgress();
        }
      },
      onError:()=>{ nextTrack(); }
    }
  });
}

function startProgress(){
  stopProgress();
  progressTimer = setInterval(()=>{
    if(!player || !ready) return;
    const duration = player.getDuration() || 0;
    const current = player.getCurrentTime() || 0;
    $("progress").value = duration ? current/duration*100 : 0;
    $("current-time").textContent = formatTime(current);
    $("duration").textContent = formatTime(duration);
  },500);
}

function stopProgress(){
  if(progressTimer) clearInterval(progressTimer);
  progressTimer = null;
}

function playTrack(i){
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(!targetList.length || !ready) return;
  index = (i + targetList.length) % targetList.length;
  const track = targetList[index];
  $("player-title").textContent = track.title;
  $("player-author").textContent = track.author;
  $("cover-art").src = track.thumb;
  player.loadVideoById(track.id);
  renderResults();
  updateMediaSession();
}

function nextTrack(){
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(targetList.length) playTrack(index+1);
}
function prevTrack(){
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(targetList.length) playTrack(index-1);
}

function updateMediaSession(){
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if('mediaSession' in navigator && index >= 0 && targetList[index]){
    const track = targetList[index];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: track.author,
      artwork: [{ src: track.thumb, sizes: '512x512', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('play', () => player.playVideo());
    navigator.mediaSession.setActionHandler('pause', () => player.pauseVideo());
    navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
    navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
  }
}

function renderResults(){
  const list = $("results");
  list.replaceChildren();
  const displayList = activeTab === "search" ? currentList : savedPlaylist;

  if(displayList.length === 0){
    const empty = document.createElement("div");
    empty.style.cssText = "text-align:center;color:var(--muted);padding:30px 0;font-size:0.8rem;";
    empty.textContent = activeTab === "search" ? "No tracks available." : "Your playlist is empty. Save tracks using the heart icon!";
    list.append(empty);
    return;
  }

  displayList.forEach((track,i)=>{
    const card = document.createElement("div");
    card.className = "track";

    const img = document.createElement("img");
    img.src = track.thumb;
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = track.title;

    const author = document.createElement("div");
    author.className = "author";
    author.textContent = track.author;

    info.append(title,author);

    // Save/Bookmark Button
    const saveBtn = document.createElement("button");
    const isSaved = savedPlaylist.some(s => s.id === track.id);
    saveBtn.className = `save-track-btn ${isSaved ? 'saved' : ''}`;
    saveBtn.innerHTML = `<i class="${isSaved ? 'fas' : 'far'} fa-heart"></i>`;
    saveBtn.title = "Save to Playlist";
    
    saveBtn.addEventListener("click",(e)=>{
      e.stopPropagation();
      toggleSaveTrack(track);
    });

    card.append(img,info,saveBtn);

    if(i === index && ((activeTab==="search" && currentList===displayList) || (activeTab==="playlist" && savedPlaylist===displayList))) {
      card.style.borderColor = "var(--cyan)";
    }

    card.addEventListener("click",()=>playTrack(i));
    list.append(card);
  });
}

function toggleSaveTrack(track){
  const idx = savedPlaylist.findIndex(s => s.id === track.id);
  if(idx !== -1){
    savedPlaylist.splice(idx,1);
    setStatus("Removed from playlist.");
  } else {
    savedPlaylist.push(track);
    setStatus("Saved to playlist!");
  }
  localStorage.setItem("neon_playlist", JSON.stringify(savedPlaylist));
  updatePlaylistCount();
  renderResults();
}

// Tabs switcher
$("tab-search").addEventListener("click",()=>{
  activeTab = "search";
  $("tab-search").classList.add("active");
  $("tab-playlist").classList.remove("active");
  index = -1;
  renderResults();
});

$("tab-playlist").addEventListener("click",()=>{
  activeTab = "playlist";
  $("tab-playlist").classList.add("active");
  $("tab-search").classList.remove("active");
  index = -1;
  renderResults();
});

async function searchYouTube(query){
  if(!YOUTUBE_API_KEY || YOUTUBE_API_KEY === "YOUR_API_KEY"){
    throw new Error("Add your valid YouTube Data API key.");
  }
  const params = new URLSearchParams({
    part:"snippet",type:"video",videoEmbeddable:"true",maxResults:"15",q:query,regionCode:"IN",key:YOUTUBE_API_KEY
  });
  const res = await fetch("https://www.googleapis.com/youtube/v3/search?"+params);
  const data = await res.json();
  if(!res.ok) throw new Error(data.error?.message || "YouTube API failed");
  return (data.items || []).filter(item=>item.id?.videoId).map(item=>({
    id:item.id.videoId,title:item.snippet.title,author:item.snippet.channelTitle,
    thumb:item.snippet.thumbnails?.medium?.url || "https://i.ytimg.com/vi/"+item.id.videoId+"/hqdefault.jpg"
  }));
}

$("search-form").addEventListener("submit",async event=>{
  event.preventDefault();
  const query = $("search-input").value.trim();
  if(!query) return;

  const videoId = getVideoId(query);
  if(videoId){
    const directTrack = { id:videoId, title:"Custom YouTube Track", author:"YouTube Stream", thumb:"https://i.ytimg.com/vi/"+videoId+"/hqdefault.jpg" };
    currentList = [directTrack, ...currentList.filter(t=>t.id!==videoId)];
    activeTab = "search";
    $("tab-search").classList.add("active");
    $("tab-playlist").classList.remove("active");
    renderResults();
    if(ready) playTrack(0);
    return;
  }

  setStatus("Searching YouTube...");
  try{
    const results = await searchYouTube(query);
    if(!results.length){ setStatus("No results found."); return; }
    currentList = results;
    activeTab = "search";
    $("tab-search").classList.add("active");
    $("tab-playlist").classList.remove("active");
    index = -1;
    renderResults();
    setStatus("Found "+currentList.length+" results.");
    playTrack(0);
  }catch(err){
    setStatus("Search error: "+err.message);
  }
});

$("play").addEventListener("click",()=>{
  if(!ready){setStatus("Loading...");return;}
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(index < 0){ if(targetList.length) playTrack(0); return; }
  const state = player.getPlayerState();
  if(state === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
});

$("next").addEventListener("click",nextTrack);
$("prev").addEventListener("click",prevTrack);

$("progress").addEventListener("change",()=>{
  if(!ready || index < 0) return;
  const duration = player.getDuration();
  if(duration) player.seekTo(duration * Number($("progress").value)/100,true);
});

$("dl-btn").addEventListener("click",()=>{
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(index < 0 || !targetList[index]){ alert("Select a song first!"); return; }
  const track = targetList[index];
  window.open("https://cobalt.tools/", "_blank");
  window.open("https://www.youtube.com/watch?v="+track.id, "_blank");
});

$("dev-btn").addEventListener("click",()=>{$("modal").style.display="flex";});
$("close-modal").addEventListener("click",()=>{$("modal").style.display="none";});
$("modal").addEventListener("click",e=>{ if(e.target === $("modal")) $("modal").style.display="none"; });
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
