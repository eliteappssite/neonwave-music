<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Wave Premium - Ultimate Audio Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#06070d;--card:#121420;--cyan:#00f3ff;--pink:#ff007f;--purple:#9d00ff;--muted:#8b949e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f0f4f8;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh}

#bg-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}

.app{position:relative;z-index:1;max-width:1200px;margin:auto;padding:20px}
header,.panel{background:rgba(18,20,32,.94);border:1px solid #ffffff18;border-radius:20px;padding:20px;margin-bottom:20px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,0.5)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font:900 1.4rem Orbitron,sans-serif;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;color:var(--cyan)}

button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;color:white;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--purple));transition:0.3s}
button:hover{opacity:0.9;box-shadow:0 0 15px rgba(0,243,255,0.3)}

input{min-width:0;padding:14px;border-radius:12px;border:1px solid #ffffff25;background:#090a12;color:white;font:inherit;outline:none}
input:focus{border-color:var(--cyan)}

.search{display:flex;gap:10px}
.search input{flex:1;width:100%}

.tabs{display:flex;gap:10px;margin-top:14px}
.tab-btn{flex:1;background:rgba(255,255,255,0.04);color:var(--muted);font-size:0.85rem;padding:10px;border-radius:12px}
.tab-btn.active{background:var(--cyan);color:#000;font-weight:800;box-shadow:0 0 15px rgba(0,243,255,0.3)}

.layout{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
.status{color:var(--cyan);font-size:.85rem;margin:14px 0}

.results{display:grid;gap:10px;max-height:500px;overflow-y:auto;padding-right:4px}
.results::-webkit-scrollbar{width:6px}
.results::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:10px}

.track{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid #ffffff15;border-radius:12px;cursor:pointer;background:rgba(255,255,255,0.02);transition:0.2s}
.track:hover{border-color:var(--cyan);background:#ffffff08;transform:translateX(4px)}
.track img{width:90px;height:60px;object-fit:cover;border-radius:8px}
.info{flex:1;min-width:0}
.title{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.author{font-size:.78rem;color:var(--muted);margin-top:5px}
.save-track-btn{background:none;color:var(--muted);padding:8px;font-size:1.1rem}
.save-track-btn.saved{color:var(--pink)}

.player{text-align:center;display:flex;flex-direction:column;align-items:center}
#player-title{font-weight:700;font-size:1rem;margin:14px 0 5px;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player-author{color:var(--muted);font-size:.85rem;margin-bottom:12px}

/* Video Mode vs Cover Wrap Container */
#yt-player-wrap{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;display:none;margin-bottom:14px}
#cover-art-wrap{width:180px;height:180px;border-radius:16px;overflow:hidden;border:2px solid #ffffff20;margin:10px auto 14px;box-shadow:0 10px 25px rgba(0,0,0,0.6)}
#cover-art-wrap img{width:100%;height:100%;object-fit:cover}

/* Lyrics Box Styling */
.lyrics-box{width:100%;max-height:110px;overflow-y:auto;background:rgba(0,0,0,0.4);border:1px solid #ffffff15;border-radius:12px;padding:10px;font-size:0.78rem;color:var(--muted);margin-bottom:14px;text-align:center;line-height:1.5}
.lyrics-box::-webkit-scrollbar{width:4px}
.lyrics-box::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:4px}

.controls{display:flex;justify-content:center;gap:12px;margin:14px 0}
.controls button{min-width:50px}
#play{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));font-size:1.2rem;display:flex;align-items:center;justify-content:center}

#progress{width:100%;accent-color:var(--cyan);cursor:pointer}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-top:6px}

.secondary{background:#29243c}
.secondary:hover{background:#3b3254;box-shadow:0 0 12px var(--purple)}

.dl-btn{width:100%;margin-top:8px;background:linear-gradient(135deg,var(--pink),var(--purple));display:flex;align-items:center;justify-content:center;gap:8px}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-content{background:var(--card);border:1px solid var(--purple);border-radius:20px;padding:28px;max-width:380px;text-align:center;position:relative}

/* Background Play Helper Container */
#yt-background-container{position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0.01;z-index:9999;pointer-events:none}

@media(max-width:850px){.layout{grid-template-columns:1fr}.app{padding:12px}header{padding:15px}h1{font-size:1.05rem}}
@media(max-width:450px){.search{flex-direction:column}.search button{width:100%}}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="app">
<header>
  <h1><i class="fas fa-compact-disc"></i> NEON WAVE</h1>
  <button class="secondary" id="dev-btn"><i class="fas fa-code"></i> Developer</button>
</header>

<div class="layout">
<section class="panel">
  <form class="search" id="search-form">
    <input id="search-input" placeholder="Search song, artist, or paste YouTube link..." autocomplete="off">
    <button type="submit"><i class="fas fa-search"></i> Search</button>
  </form>

  <div class="tabs">
    <button class="tab-btn active" id="tab-search">Search / Trending</button>
    <button class="tab-btn" id="tab-playlist">My Playlist (<span id="playlist-count">0</span>)</button>
  </div>

  <div class="status" id="status">Ready to search YouTube.</div>
  <div class="results" id="results"></div>
</section>

<section class="panel player">
  <div style="display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:6px">
    <div style="color:var(--cyan);font-weight:700;font-size:0.85rem"><i class="fas fa-headphones"></i> NOW PLAYING</div>
    <button class="secondary" id="toggle-view-btn" style="padding:6px 12px;font-size:0.72rem"><i class="fas fa-video"></i> Show Video</button>
  </div>

  <!-- Video Mode Container -->
  <div id="yt-player-wrap">
    <div id="yt-visible-player"></div>
  </div>

  <!-- Cover Art Wrap -->
  <div id="cover-art-wrap">
    <img id="cover-art" src="https://i.ytimg.com/vi/HNdauINck9s/hqdefault.jpg" alt="Cover">
  </div>

  <div id="player-title">Select a song</div>
  <div id="player-author">YouTube</div>

  <!-- Live Synced Lyrics Box -->
  <div class="lyrics-box" id="lyrics-display">
    🎵 Lyrics will appear here automatically...
  </div>

  <input id="progress" type="range" min="0" max="100" value="0">
  <div class="times"><span id="current-time">0:00</span><span id="duration">0:00</span></div>

  <div class="controls">
    <button class="secondary" id="prev" aria-label="Previous"><i class="fas fa-backward"></i></button>
    <button id="play" aria-label="Play"><i class="fas fa-play"></i></button>
    <button class="secondary" id="next" aria-label="Next"><i class="fas fa-forward"></i></button>
  </div>

  <button class="dl-btn" id="dl-btn"><i class="fas fa-download"></i> Download MP3 (Auto-Paste)</button>
</section>
</div>
</div>

<!-- Background Play Audio Engine -->
<div id="yt-background-container"><div id="yt-player"></div></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <button id="close-modal" class="secondary" style="position:absolute;top:15px;right:18px;padding:6px 10px">✕</button>
    
    <!-- Simple PFP -->
    <div style="width:75px;height:75px;border-radius:50%;margin:0 auto 12px;overflow:hidden;border:2px solid var(--cyan);box-shadow:0 0 15px rgba(0,243,255,0.4);background:#090a12;display:flex;align-items:center;justify-content:center;">
      <i class="fas fa-user-astronaut" style="font-size:2.2rem;color:var(--cyan)"></i>
    </div>

    <h2 style="font-family:Orbitron;color:var(--cyan);font-size:1.2rem;margin-bottom:4px">NEON WAVE</h2>
    <p style="color:var(--pink);font-weight:700;margin-bottom:6px">Developed by Tarun</p>
    <p style="color:var(--muted);font-size:0.8rem;line-height:1.4;margin-bottom:16px">Neon Wave Premium — YouTube audio aggregator, lyrics fetcher, and background player.</p>
    
    <a href="https://www.instagram.com/tarun.amv/" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;border-radius:30px;text-decoration:none;font-weight:700;font-size:0.85rem;">
      <i class="fab fa-instagram"></i> Follow @tarun.amv
    </a>
  </div>
</div>

<script>
const YOUTUBE_API_KEY = "AIzaSyDVnj4IsgnFxJwnBysA5wk8kF4DVJBsEWs";

const $ = id => document.getElementById(id);
const status = $("status");
let player = null;
let visiblePlayer = null;
let ready = false;
let currentList = [];
let savedPlaylist = JSON.parse(localStorage.getItem("neon_playlist") || "[]");
let activeTab = "search";
let index = -1;
let progressTimer = null;
let isVideoMode = false;

// Premium Trending Suggestions (Loaded by default if nothing is searched)
const defaultTrending = [
  { id: 'HNdauINck9s', title: 'Trending Hindi Mashup 2026', author: 'COZI Music', thumb: 'https://i.ytimg.com/vi/HNdauINck9s/hqdefault.jpg' },
  { id: '10gxMMO2X40', title: 'Best Bollywood Love Songs', author: 'VDj Royal', thumb: 'https://i.ytimg.com/vi/10gxMMO2X40/hqdefault.jpg' },
  { id: 'm67Xdu78PrA', title: 'Top Global Chartbusters', author: 'Grow Music', thumb: 'https://i.ytimg.com/vi/m67Xdu78PrA/hqdefault.jpg' },
  { id: '5qap5aO4i9A', title: 'Lofi Hip Hop Radio - Beats', author: 'Lofi Girl', thumb: 'https://i.ytimg.com/vi/5qap5aO4i9A/hqdefault.jpg' }
];

currentList = [...defaultTrending];

function setStatus(message){ status.textContent = message; }
function updatePlaylistCount(){ $("playlist-count").textContent = savedPlaylist.length; }
updatePlaylistCount();

function formatTime(value){
  if(!Number.isFinite(value) || value < 0) return "0:00";
  const s = Math.floor(value);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

function getVideoId(text){
  try{
    const url = new URL(text);
    if(url.hostname === "youtu.be") return url.pathname.split("/")[1] || null;
    if(url.hostname.endsWith("youtube.com")){
      if(url.pathname === "/watch") return url.searchParams.get("v");
      const parts = url.pathname.split("/");
      if(["embed","shorts","live"].includes(parts[1])) return parts[2] || null;
    }
  }catch{}
  return /^[a-zA-Z0-9_-]{11}$/.test(text) ? text : null;
}

function onYouTubeIframeAPIReady(){
  // Hidden background player for true lock-screen / background playback
  player = new YT.Player("yt-player",{
    width:"100%",
    height:"100%",
    videoId: currentList[0].id,
    playerVars:{ playsinline:1, controls:0, rel:0, autoplay:0 },
    events:{
      onReady:()=>{
        ready = true;
        setStatus("YouTube player ready. Select a song or search.");
        renderResults();
      },
      onStateChange:event=>{
        if(event.data === YT.PlayerState.PLAYING){
          $("play").innerHTML='<i class="fas fa-pause"></i>';
          setStatus("Playing audio in background.");
          startProgress();
          updateMediaSession();
        }else{
          $("play").innerHTML='<i class="fas fa-play"></i>';
          if(event.data === YT.PlayerState.ENDED) nextTrack(); // Auto Next Play
          if(event.data !== YT.PlayerState.PLAYING) stopProgress();
        }
      },
      onError:()=>{ nextTrack(); }
    }
  });

  // Visible Video Player
  visiblePlayer = new YT.Player("yt-visible-player",{
    width:"100%",
    height:"100%",
    videoId: currentList[0].id,
    playerVars:{ playsinline:1, controls:1, rel:0, autoplay:0 }
  });
}

function startProgress(){
  stopProgress();
  progressTimer = setInterval(()=>{
    if(!player || !ready) return;
    const duration = player.getDuration() || 0;
    const current = player.getCurrentTime() || 0;
    $("progress").value = duration ? current/duration*100 : 0;
    $("current-time").textContent = formatTime(current);
    $("duration").textContent = formatTime(duration);
  },500);
}

function stopProgress(){
  if(progressTimer) clearInterval(progressTimer);
  progressTimer = null;
}

function playTrack(i){
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(!targetList.length || !ready) return;
  index = (i + targetList.length) % targetList.length;
  const track = targetList[index];
  $("player-title").textContent = track.title;
  $("player-author").textContent = track.author;
  $("cover-art").src = track.thumb;

  player.loadVideoById(track.id);
  if(visiblePlayer && visiblePlayer.loadVideoById){
    visiblePlayer.loadVideoById(track.id);
  }

  renderResults();
  updateMediaSession();
  fetchLyrics(track.title);
}

function nextTrack(){
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(targetList.length) playTrack(index+1);
}
function prevTrack(){
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(targetList.length) playTrack(index-1);
}

// Background MediaSession Support (Lock Screen / Notification controls)
function updateMediaSession(){
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if('mediaSession' in navigator && index >= 0 && targetList[index]){
    const track = targetList[index];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: track.author,
      artwork: [{ src: track.thumb, sizes: '512x512', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('play', () => player.playVideo());
    navigator.mediaSession.setActionHandler('pause', () => player.pauseVideo());
    navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
    navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
  }
}

// Live Synced Lyrics Fetcher via LRCLIB
async function fetchLyrics(songTitle){
  $("lyrics-display").textContent = "Fetching lyrics...";
  try{
    const clean = songTitle.replace(/official|video|lyrics|audio|hd|4k/gi, "").trim();
    const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(clean)}`);
    const data = await res.json();
    if(data && data.length > 0 && data[0].plainLyrics){
      $("lyrics-display").textContent = data[0].plainLyrics;
    } else {
      $("lyrics-display").textContent = "No lyrics found for this track.";
    }
  }catch(e){
    $("lyrics-display").textContent = "Could not load lyrics.";
  }
}

function renderResults(){
  const list = $("results");
  list.replaceChildren();
  const displayList = activeTab === "search" ? currentList : savedPlaylist;

  if(displayList.length === 0){
    const empty = document.createElement("div");
    empty.style.cssText = "text-align:center;color:var(--muted);padding:40px 0;font-size:0.85rem;";
    empty.textContent = activeTab === "search" ? "No results found. Try searching another song!" : "Your playlist is empty. Save tracks using the heart icon!";
    list.append(empty);
    return;
  }

  displayList.forEach((track,i)=>{
    const card = document.createElement("div");
    card.className = "track";

    const img = document.createElement("img");
    img.src = track.thumb;
    img.alt = "";
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = track.title;

    const author = document.createElement("div");
    author.className = "author";
    author.textContent = track.author;

    info.append(title,author);

    // Save to Playlist Heart Button
    const saveBtn = document.createElement("button");
    const isSaved = savedPlaylist.some(s => s.id === track.id);
    saveBtn.className = `save-track-btn ${isSaved ? 'saved' : ''}`;
    saveBtn.innerHTML = `<i class="${isSaved ? 'fas' : 'far'} fa-heart"></i>`;
    saveBtn.title = "Save to Playlist";
    
    saveBtn.addEventListener("click",(e)=>{
      e.stopPropagation();
      toggleSaveTrack(track);
    });

    card.append(img,info,saveBtn);

    if(i === index && ((activeTab==="search" && currentList===displayList) || (activeTab==="playlist" && savedPlaylist===displayList))){
      card.style.borderColor = "var(--cyan)";
    }
    card.addEventListener("click",()=>playTrack(i));
    list.append(card);
  });
}

function toggleSaveTrack(track){
  const idx = savedPlaylist.findIndex(s => s.id === track.id);
  if(idx !== -1){
    savedPlaylist.splice(idx,1);
    setStatus("Removed from playlist.");
  } else {
    savedPlaylist.push(track);
    setStatus("Saved to playlist!");
  }
  localStorage.setItem("neon_playlist", JSON.stringify(savedPlaylist));
  updatePlaylistCount();
  renderResults();
}

$("tab-search").addEventListener("click",()=>{
  activeTab = "search";
  $("tab-search").classList.add("active");
  $("tab-playlist").classList.remove("active");
  index = -1;
  renderResults();
});

$("tab-playlist").addEventListener("click",()=>{
  activeTab = "playlist";
  $("tab-playlist").classList.add("active");
  $("tab-search").classList.remove("active");
  index = -1;
  renderResults();
});

// Toggle Video Mode vs Cover/Lyrics Mode
$("toggle-view-btn").addEventListener("click",()=>{
  isVideoMode = !isVideoMode;
  if(isVideoMode){
    $("cover-art-wrap").style.display = "none";
    $("yt-player-wrap").style.display = "block";
    $("lyrics-display").style.display = "none";
    $("toggle-view-btn").innerHTML = '<i class="fas fa-headphones"></i> Show Lyrics';
  } else {
    $("cover-art-wrap").style.display = "block";
    $("yt-player-wrap").style.display = "none";
    $("lyrics-display").style.display = "block";
    $("toggle-view-btn").innerHTML = '<i class="fas fa-video"></i> Show Video';
  }
});

async function searchYouTube(query){
  if(!YOUTUBE_API_KEY){
    throw new Error("Add your YouTube API key.");
  }
  const params = new URLSearchParams({
    part:"snippet",
    type:"video",
    videoEmbeddable:"true",
    maxResults:"15",
    q:query,
    regionCode:"IN",
    key:YOUTUBE_API_KEY
  });

  const response = await fetch("https://www.googleapis.com/youtube/v3/search?"+params);
  const data = await response.json();

  if(!response.ok){
    const reason = data.error?.errors?.[0]?.reason;
    throw new Error(reason || data.error?.message || "YouTube API request failed");
  }

  return (data.items || [])
    .filter(item=>item.id?.videoId)
    .map(item=>({
      id:item.id.videoId,
      title:item.snippet.title,
      author:item.snippet.channelTitle,
      thumb:item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || "https://i.ytimg.com/vi/"+item.id.videoId+"/hqdefault.jpg"
    }));
}

$("search-form").addEventListener("submit",async event=>{
  event.preventDefault();
  const query = $("search-input").value.trim();
  if(!query) return;

  const videoId = getVideoId(query);
  if(videoId){
    const directTrack = {
      id:videoId,
      title:"Custom YouTube Track",
      author:"YouTube Stream",
      thumb:"https://i.ytimg.com/vi/"+videoId+"/hqdefault.jpg"
    };
    currentList = [directTrack,...currentList.filter(t=>t.id!==videoId)];
    activeTab = "search";
    $("tab-search").classList.add("active");
    $("tab-playlist").classList.remove("active");
    renderResults();
    if(ready) playTrack(0);
    return;
  }

  setStatus("Searching YouTube...");
  try{
    const results = await searchYouTube(query);
    if(!results.length){
      setStatus("No results found. Try premium suggestions!");
      currentList = defaultTrending;
      renderResults();
      return;
    }
    currentList = results;
    activeTab = "search";
    $("tab-search").classList.add("active");
    $("tab-playlist").classList.remove("active");
    index = -1;
    renderResults();
    setStatus("Found "+currentList.length+" results.");
    playTrack(0);
  }catch(error){
    console.error(error);
    setStatus("Search failed: "+error.message);
  }
});

$("play").addEventListener("click",()=>{
  if(!ready){setStatus("YouTube player is loading.");return;}
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(index < 0){
    if(targetList.length) playTrack(0);
    else setStatus("Search for a song first.");
    return;
  }
  const state = player.getPlayerState();
  if(state === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
});

$("next").addEventListener("click",nextTrack);
$("prev").addEventListener("click",prevTrack);

$("progress").addEventListener("change",()=>{
  if(!ready || index < 0) return;
  const duration = player.getDuration();
  if(duration) player.seekTo(duration * Number($("progress").value)/100,true);
});

// Auto-Paste YouTube Link into Downloader (Cobalt Tools)
$("dl-btn").addEventListener("click",()=>{
  const targetList = activeTab === "search" ? currentList : savedPlaylist;
  if(index < 0 || !targetList[index]){
    alert("Please play or select a song first!");
    return;
  }
  const track = targetList[index];
  const ytUrl = "https://www.youtube.com/watch?v=" + track.id;
  
  window.open("https://cobalt.tools/", "_blank");
  window.open(ytUrl, "_blank");
});

$("dev-btn").addEventListener("click",()=>{$("modal").style.display="flex";});
$("close-modal").addEventListener("click",()=>{$("modal").style.display="none";});
$("modal").addEventListener("click",event=>{
  if(event.target === $("modal")) $("modal").style.display="none";
});

// Background Particles Animation
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let pts = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.onresize = resize;
resize();
for(let i=0; i<40; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*2+1, dx: (Math.random()-0.5)*0.4, dy: (Math.random()-0.5)*0.4 });
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = 'rgba(0, 243, 255, 0.25)';
  pts.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    p.x += p.dx; p.y += p.dy;
    if(p.x<0 || p.x>canvas.width) p.dx *= -1;
    if(p.y<0 || p.y>canvas.height) p.dy *= -1;
  });
  requestAnimationFrame(draw);
}
draw();
</script>
