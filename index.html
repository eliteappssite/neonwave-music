<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Wave - Premium Audio Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#06070d;--card:rgba(18, 20, 32, 0.85);--cyan:#00f3ff;--pink:#ff007f;--purple:#9d00ff;--muted:#8b949e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f0f4f8;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;overflow-x:hidden}

#bg-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:1200px;margin:auto;padding:20px;display:flex;flex-direction:column;min-height:100vh}

header,.panel{background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:24px;margin-bottom:20px;box-shadow:0 12px 40px rgba(0,0,0,0.4)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font:900 1.4rem Orbitron,sans-serif;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0}

button{cursor:pointer;border:0;border-radius:14px;padding:12px 20px;color:white;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--purple));transition:0.3s}
button:hover{opacity:0.9;box-shadow:0 0 15px rgba(0,243,255,0.3)}
input{min-width:0;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.4);color:white;font:inherit;outline:none;transition:0.3s}
input:focus{border-color:var(--cyan);box-shadow:0 0 15px rgba(0,243,255,0.2)}

.search{display:flex;gap:12px}
.search input{flex:1;width:100%}
.layout{display:grid;grid-template-columns:1fr 380px;gap:24px;flex:1}
.status{color:var(--cyan);font-size:.85rem;margin:14px 0;display:flex;align-items:center;gap:6px}

.results{display:grid;gap:12px;max-height:500px;overflow-y:auto;padding-right:4px}
.results::-webkit-scrollbar{width:6px}
.results::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:10px}

.track{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid transparent;border-radius:14px;cursor:pointer;background:rgba(255,255,255,0.02);transition:0.25s}
.track:hover{border-color:rgba(0,243,255,0.3);background:rgba(255,255,255,0.06);transform:translateX(4px)}
.track img{width:60px;height:60px;object-fit:cover;border-radius:10px}
.info{flex:1;min-width:0}
.title{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.author{font-size:.75rem;color:var(--muted)}

.player{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.cover-wrap{position:relative;width:200px;height:200px;margin:10px auto 20px;border-radius:20px;overflow:hidden;border:2px solid rgba(255,255,255,0.08);box-shadow:0 12px 30px rgba(0,0,0,0.6)}
.cover-wrap img{width:100%;height:100%;object-fit:cover}

#player-title{font-weight:700;font-size:1.1rem;margin-bottom:4px;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player-author{color:var(--muted);font-size:.85rem;margin-bottom:20px}

.controls{display:flex;justify-content:center;align-items:center;gap:15px;margin:15px 0}
.ctrl-btn{background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:0}
.ctrl-btn:hover{color:var(--cyan);transform:scale(1.15)}
#play{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));font-size:1.3rem;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(0,243,255,0.4)}

.progress-wrap{width:100%;margin-bottom:15px}
#progress{width:100%;accent-color:var(--cyan);cursor:pointer}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;margin-top:6px}

.secondary{background:transparent;border:1px solid var(--purple)}
.secondary:hover{background:var(--purple);box-shadow:0 0 15px var(--purple)}

.dl-btn{width:100%;background:linear-gradient(135deg,var(--pink),var(--purple));margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-content{background:var(--card);border:1px solid var(--purple);border-radius:20px;padding:30px;max-width:400px;text-align:center;position:relative}

/* Completely hide the YouTube video element so no video is shown on screen */
#yt-hidden-container { position: absolute; top: -9999px; left: -9999px; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none; }

@media(max-width:850px){.layout{grid-template-columns:1fr}.app{padding:12px}header{padding:15px}}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="app">
<header>
  <h1><i class="fas fa-compact-disc"></i> NEON WAVE</h1>
  <button class="secondary" id="dev-btn"><i class="fas fa-code"></i> Developer</button>
</header>

<div class="layout">
<section class="panel">
  <form class="search" id="search-form">
    <input id="search-input" placeholder="Search song name or paste YouTube link..." autocomplete="off">
    <button type="submit"><i class="fas fa-search"></i> Search</button>
  </form>
  <div class="status" id="status"><i class="fas fa-info-circle"></i> Ready to search YouTube.</div>
  <div class="results" id="results"></div>
</section>

<section class="panel player">
  <div>
    <div style="color:var(--cyan);font-weight:700;font-size:0.9rem;margin-bottom:10px">
      <i class="fas fa-headphones"></i> AUDIO ENGINE
    </div>
    <div class="cover-wrap">
      <img id="cover-art" src="https://i.ytimg.com/vi/HNdauINck9s/hqdefault.jpg" alt="Cover">
    </div>
    <div id="player-title">Select a song</div>
    <div id="player-author">Neon Wave Music</div>
  </div>

  <div class="progress-wrap">
    <input id="progress" type="range" min="0" max="100" value="0">
    <div class="times"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prev" aria-label="Previous"><i class="fas fa-step-backward"></i></button>
    <button class="ctrl-btn" id="play" aria-label="Play"><i class="fas fa-play"></i></button>
    <button class="ctrl-btn" id="next" aria-label="Next"><i class="fas fa-step-forward"></i></button>
  </div>

  <button class="dl-btn" id="dl-btn"><i class="fas fa-download"></i> Instant MP3 Download</button>
</section>
</div>
</div>

<!-- Hidden YouTube Container to satisfy background play without visual video -->
<div id="yt-hidden-container"><div id="yt-player"></div></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <button id="close-modal" class="secondary" style="position:absolute; top:15px; right:20px; padding:6px 12px;">✕</button>
    <h2 style="font-family:Orbitron;color:var(--cyan);margin-bottom:6px">NEON WAVE</h2>
    <p style="color:var(--pink);font-weight:700;margin-bottom:12px">Developed by Tarun</p>
    <p style="color:var(--muted);font-size:0.85rem;line-height:1.5;margin-bottom:20px">Neon Wave Premium — High performance unblocked audio player with background media session support.</p>
    <a href="https://www.instagram.com/tarun.amv?mdxt=bXZndmRvN3Q1d2No" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);color:#fff;border-radius:30px;text-decoration:none;font-weight:700;font-size:0.9rem;">
      <i class="fab fa-instagram"></i> Follow @tarun.amv
    </a>
  </div>
</div>

<script>
// Yahan apni YouTube Data API v3 key dalein
const YOUTUBE_API_KEY = "AIzaSyDVnj4IsgnFxJwnBysA5wk8kF4DVJBsEWs";

const $ = id => document.getElementById(id);
const status = $("status");
let player = null;
let ready = false;
let playlist = [
  { id: 'HNdauINck9s', title: 'Trending Hindi Songs 2026', author: 'COZI Music', thumb: 'https://i.ytimg.com/vi/HNdauINck9s/hqdefault.jpg' },
  { id: '10gxMMO2X40', title: 'Best Hindi Love Songs', author: 'VDj Royal', thumb: 'https://i.ytimg.com/vi/10gxMMO2X40/hqdefault.jpg' },
  { id: 'm67Xdu78PrA', title: 'Top Global Hits', author: 'Grow Music', thumb: 'https://i.ytimg.com/vi/m67Xdu78PrA/hqdefault.jpg' }
];
let index = -1;
let progressTimer = null;

function setStatus(message){ status.innerHTML = `<i class="fas fa-info-circle"></i> ${message}`; }

function formatTime(value){
  if(!Number.isFinite(value) || value < 0) return "0:00";
  const s = Math.floor(value);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

function getVideoId(text){
  try{
    const url = new URL(text);
    if(url.hostname === "youtu.be") return url.pathname.split("/")[1] || null;
    if(url.hostname.endsWith("youtube.com")){
      if(url.pathname === "/watch") return url.searchParams.get("v");
      const parts = url.pathname.split("/");
      if(["embed","shorts","live"].includes(parts[1])) return parts[2] || null;
    }
  }catch{}
  return /^[a-zA-Z0-9_-]{11}$/.test(text) ? text : null;
}

function onYouTubeIframeAPIReady(){
  player = new YT.Player("yt-player",{
    width:"0",
    height:"0",
    videoId: playlist[0].id,
    playerVars:{ playsinline:1, controls:0, rel:0, autoplay:0 },
    events:{
      onReady:()=>{
        ready = true;
        setStatus("Audio Engine Ready. Search or play default playlist.");
        renderResults();
      },
      onStateChange:event=>{
        if(event.data === YT.PlayerState.PLAYING){
          $("play").innerHTML='<i class="fas fa-pause"></i>';
          setStatus("Playing audio in background.");
          startProgress();
          updateMediaSession();
        }else{
          $("play").innerHTML='<i class="fas fa-play"></i>';
          if(event.data === YT.PlayerState.ENDED) nextTrack();
          if(event.data !== YT.PlayerState.PLAYING) stopProgress();
        }
      },
      onError:event=>{
        setStatus("Playback error code ("+event.data+"). Skipping track...");
        nextTrack();
      }
    }
  });
}

function startProgress(){
  stopProgress();
  progressTimer = setInterval(()=>{
    if(!player || !ready) return;
    const duration = player.getDuration() || 0;
    const current = player.getCurrentTime() || 0;
    $("progress").value = duration ? current/duration*100 : 0;
    $("current-time").textContent = formatTime(current);
    $("duration").textContent = formatTime(duration);
  },500);
}

function stopProgress(){
  if(progressTimer) clearInterval(progressTimer);
  progressTimer = null;
}

function playTrack(i){
  if(!playlist.length || !ready) return;
  index = (i + playlist.length) % playlist.length;
  const track = playlist[index];
  $("player-title").textContent = track.title;
  $("player-author").textContent = track.author;
  $("cover-art").src = track.thumb;
  player.loadVideoById(track.id);
  renderResults();
}

function nextTrack(){ if(playlist.length) playTrack(index+1); }
function prevTrack(){ if(playlist.length) playTrack(index-1); }

// Background MediaSession API for Screen-Off / Lock-Screen Playback Support
function updateMediaSession(){
  if('mediaSession' in navigator && index >= 0 && playlist[index]){
    const track = playlist[index];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: track.author,
      artwork: [{ src: track.thumb, sizes: '512x512', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('play', () => player.playVideo());
    navigator.mediaSession.setActionHandler('pause', () => player.pauseVideo());
    navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
    navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
  }
}

function renderResults(){
  const list = $("results");
  list.replaceChildren();
  playlist.forEach((track,i)=>{
    const card = document.createElement("div");
    card.className = "track";

    const img = document.createElement("img");
    img.src = track.thumb;
    img.alt = "";
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = track.title;

    const author = document.createElement("div");
    author.className = "author";
    author.textContent = track.author;

    info.append(title,author);
    card.append(img,info);

    if(i === index) card.style.borderColor = "var(--cyan)";
    card.addEventListener("click",()=>playTrack(i));
    list.append(card);
  });
}

async function searchYouTube(query){
  if(!YOUTUBE_API_KEY || YOUTUBE_API_KEY === "YOUR_API_KEY"){
    throw new Error("Please add your valid YouTube Data API key in the YOUTUBE_API_KEY variable.");
  }

  const params = new URLSearchParams({
    part:"snippet",
    type:"video",
    videoEmbeddable:"true",
    maxResults:"15",
    q:query,
    regionCode:"IN",
    key:YOUTUBE_API_KEY
  });

  const response = await fetch("https://www.googleapis.com/youtube/v3/search?"+params);
  const data = await response.json();

  if(!response.ok){
    const reason = data.error?.errors?.[0]?.reason;
    throw new Error(reason || data.error?.message || "YouTube API request failed");
  }

  return (data.items || [])
    .filter(item=>item.id?.videoId)
    .map(item=>({
      id:item.id.videoId,
      title:item.snippet.title,
      author:item.snippet.channelTitle,
      thumb:item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || "https://i.ytimg.com/vi/"+item.id.videoId+"/hqdefault.jpg"
    }));
}

$("search-form").addEventListener("submit",async event=>{
  event.preventDefault();
  const query = $("search-input").value.trim();
  if(!query) return;

  const videoId = getVideoId(query);
  if(videoId){
    const directTrack = {
      id:videoId,
      title:"Custom YouTube Track",
      author:"YouTube Stream",
      thumb:"https://i.ytimg.com/vi/"+videoId+"/hqdefault.jpg"
    };
    playlist = [directTrack,...playlist.filter(t=>t.id!==videoId)];
    renderResults();
    if(ready) playTrack(0);
    return;
  }

  setStatus("Searching YouTube...");
  $("results").replaceChildren();

  try{
    const results = await searchYouTube(query);
    if(!results.length){
      setStatus("No results found. Try another query.");
      return;
    }
    playlist = results;
    index = -1;
    renderResults();
    setStatus("Found "+playlist.length+" results. Click any track to play.");
    playTrack(0);
  }catch(error){
    console.error(error);
    setStatus("Search error: "+error.message);
  }
});

$("play").addEventListener("click",()=>{
  if(!ready){setStatus("Player is loading...");return;}
  if(index < 0){
    if(playlist.length) playTrack(0);
    return;
  }
  const state = player.getPlayerState();
  if(state === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
});

$("next").addEventListener("click",nextTrack);
$("prev").addEventListener("click",prevTrack);

$("progress").addEventListener("change",()=>{
  if(!ready || index < 0) return;
  const duration = player.getDuration();
  if(duration) player.seekTo(duration * Number($("progress").value)/100,true);
});

// Auto MP3 Download integration via Cobalt downloader mirror
$("dl-btn").addEventListener("click",()=>{
  if(index < 0 || !playlist[index]){
    alert("Please play or select a song first!");
    return;
  }
  const track = playlist[index];
  window.open("https://cobalt.tools/", "_blank");
  window.open("https://www.youtube.com/watch?v="+track.id, "_blank");
});

$("dev-btn").addEventListener("click",()=>{$("modal").style.display="flex";});
$("close-modal").addEventListener("click",()=>{$("modal").style.display="none";});
$("modal").addEventListener("click",event=>{
  if(event.target === $("modal")) $("modal").style.display="none";
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
