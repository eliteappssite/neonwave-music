<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Wave - Soundbound Music Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg: #06070d;
      --card-bg: rgba(18, 20, 32, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-purple: #9d00ff;
      --text: #f0f4f8;
      --text-muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

    .header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--card-border); margin-bottom: 20px; }
    .brand { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: var(--neon-cyan); letter-spacing: 1px; }

    .badge { background: rgba(0, 243, 255, 0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }

    .main-grid { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

    .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; backdrop-filter: blur(12px); }

    .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
    .search-box input { flex: 1; padding: 12px 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--card-border); border-radius: 12px; color: #fff; outline: none; }
    .search-box input:focus { border-color: var(--neon-cyan); }
    .search-btn { padding: 12px 20px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); border: none; border-radius: 12px; color: #fff; font-weight: bold; cursor: pointer; }

    .provider-status { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 15px; display: flex; align-items: center; gap: 6px; }

    .track-list { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; }
    .track-card { display: flex; align-items: center; gap: 12px; padding: 10px; background: rgba(255,255,255,0.02); border: 1px solid transparent; border-radius: 12px; cursor: pointer; transition: 0.2s; }
    .track-card:hover { background: rgba(255,255,255,0.06); border-color: var(--neon-cyan); }
    .track-card img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
    .track-info { flex: 1; overflow: hidden; }
    .track-title { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-author { font-size: 0.75rem; color: var(--text-muted); }

    .player-panel { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    .cover-art { width: 190px; height: 190px; border-radius: 16px; object-fit: cover; margin-bottom: 15px; border: 2px solid var(--card-border); box-shadow: 0 10px 25px rgba(0,243,255,0.2); }
    .song-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-author { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px; }

    .controls { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
    .ctrl-btn { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }
    .play-btn { width: 52px; height: 52px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; box-shadow: 0 0 20px rgba(0,243,255,0.4); }

    .dl-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); border: none; border-radius: 12px; color: #fff; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

    #fallback-audio-player { display: none; }
    #yt-hidden-engine { position: absolute; top: -9999px; left: -9999px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand"><i class="fas fa-network-wired"></i> NEON WAVE</div>
    <div class="badge" id="source-badge">Soundbound Engine Active</div>
  </div>

  <div class="main-grid">
    <div class="panel">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Type Song Name or Paste YT Link...">
        <button class="search-btn" id="search-btn">Search</button>
      </div>

      <div class="provider-status">
        <i class="fas fa-server" style="color:var(--neon-cyan)"></i> Active Source: <strong id="active-provider-name" style="color:#fff;">Audio Mirror API</strong>
      </div>

      <div class="track-list" id="track-list"></div>
    </div>

    <div class="panel player-panel">
      <div>
        <img id="cover" class="cover-art" src="https://i.ytimg.com/vi/HNdauINck9s/hqdefault.jpg">
        <div class="song-title" id="song-title">Select a Track</div>
        <div class="song-author" id="song-author">Neon Sound Engine</div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="prev-btn"><i class="fas fa-step-backward"></i></button>
        <button class="ctrl-btn play-btn" id="play-btn"><i class="fas fa-play"></i></button>
        <button class="ctrl-btn" id="next-btn"><i class="fas fa-step-forward"></i></button>
      </div>

      <button class="dl-btn" id="dl-btn"><i class="fas fa-download"></i> Download MP3 Audio</button>
    </div>
  </div>

  <audio id="fallback-audio-player"></audio>
  <div id="yt-hidden-engine"><div id="yt-player"></div></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const catalog = [
      { id: 'HNdauINck9s', title: 'Trending Hindi Playlist', author: 'COZI Music', thumb: 'https://i.ytimg.com/vi/HNdauINck9s/hqdefault.jpg', type: 'yt' },
      { id: '10gxMMO2X40', title: 'Best Hindi Love Songs', author: 'VDj Royal', thumb: 'https://i.ytimg.com/vi/10gxMMO2X40/hqdefault.jpg', type: 'yt' },
      { id: 'm67Xdu78PrA', title: 'Top Trending Songs 2026', author: 'Grow Music', thumb: 'https://i.ytimg.com/vi/m67Xdu78PrA/hqdefault.jpg', type: 'yt' }
    ];

    let playlist = [...catalog];
    let currentIndex = 0;
    let ytPlayer = null;
    let isPlaying = false;
    let currentMode = 'yt';

    const audioPlayer = document.getElementById('fallback-audio-player');

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '0', width: '0',
        videoId: playlist[0].id,
        playerVars: { 'autoplay': 0, 'controls': 0 },
        events: {
          'onReady': () => { renderTracks(); loadTrack(0, false); },
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              document.getElementById('play-btn').innerHTML = '<i class="fas fa-pause"></i>';
            } else {
              isPlaying = false;
              document.getElementById('play-btn').innerHTML = '<i class="fas fa-play"></i>';
            }
          }
        }
      });
    }

    function renderTracks() {
      const list = document.getElementById('track-list');
      list.innerHTML = '';
      playlist.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = 'track-card';
        if (idx === currentIndex) item.style.borderColor = 'var(--neon-cyan)';
        item.innerHTML = `
          <img src="${s.thumb}">
          <div class="track-info">
            <div class="track-title">${s.title}</div>
            <div class="track-author">${s.author}</div>
          </div>
        `;
        item.onclick = () => loadTrack(idx, true);
        list.appendChild(item);
      });
    }

    function loadTrack(idx, autoPlay = true) {
      currentIndex = idx;
      const s = playlist[idx];
      document.getElementById('song-title').innerText = s.title;
      document.getElementById('song-author').innerText = s.author;
      document.getElementById('cover').src = s.thumb;

      if (s.audioUrl) {
        currentMode = 'audio';
        if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
        audioPlayer.src = s.audioUrl;
        if (autoPlay) {
          audioPlayer.play();
          isPlaying = true;
          document.getElementById('play-btn').innerHTML = '<i class="fas fa-pause"></i>';
        }
      } else {
        currentMode = 'yt';
        audioPlayer.pause();
        if (ytPlayer && ytPlayer.loadVideoById) {
          if (autoPlay) ytPlayer.loadVideoById(s.id);
          else ytPlayer.cueVideoById(s.id);
        }
      }
      renderTracks();
    }

    document.getElementById('play-btn').onclick = () => {
      if (currentMode === 'audio') {
        if (audioPlayer.paused) { audioPlayer.play(); isPlaying = true; }
        else { audioPlayer.pause(); isPlaying = false; }
        document.getElementById('play-btn').innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
      } else if (ytPlayer) {
        if (isPlaying) ytPlayer.pauseVideo();
        else ytPlayer.playVideo();
      }
    };

    function nextTrack() {
      currentIndex = (currentIndex + 1) % playlist.length;
      loadTrack(currentIndex, true);
    }
    function prevTrack() {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex, true);
    }

    document.getElementById('next-btn').onclick = nextTrack;
    document.getElementById('prev-btn').onclick = prevTrack;

    // Dual Search Engine (Saavn API for names + YT Link Parser)
    document.getElementById('search-btn').onclick = async () => {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      let vid = '';
      if (query.includes('v=')) vid = query.split('v=')[1].split('&')[0];
      else if (query.includes('youtu.be/')) vid = query.split('youtu.be/')[1].split('?')[0];
      else if (query.length === 11) vid = query;

      if (vid) {
        // Option A: Direct YouTube Link
        const track = { id: vid, title: 'YouTube Audio Stream', author: 'YouTube Track', thumb: `https://i.ytimg.com/vi/${vid}/hqdefault.jpg` };
        playlist.unshift(track);
        loadTrack(0, true);
      } else {
        // Option B: Song Name Search via Free Audio Mirror API
        try {
          const res = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}`);
          const data = await res.json();
          if (data.success && data.data.results.length > 0) {
            const top = data.data.results[0];
            const track = {
              id: top.id,
              title: top.name,
              author: top.artists.primary[0]?.name || 'Unknown Artist',
              thumb: top.image[2]?.link || top.image[0]?.link,
              audioUrl: top.downloadUrl[4]?.link || top.downloadUrl[2]?.link
            };
            playlist.unshift(track);
            loadTrack(0, true);
          } else {
            alert("No song found! Try typing exact song name.");
          }
        } catch (e) {
          alert("Search error. Check internet connection.");
        }
      }
    };

    // MP3 Downloader
    document.getElementById('dl-btn').onclick = () => {
      const s = playlist[currentIndex];
      if (s.audioUrl) {
        // Direct MP3 Download link
        window.open(s.audioUrl, '_blank');
      } else {
        // YouTube Downloader Redirect
        window.open(`https://cobalt.tools/`, '_blank');
        window.open(`https://www.youtube.com/watch?v=${s.id}`, '_blank');
      }
    };
  </script>
</body>
</html>
